<script>
(function(){
/* ===== 數學預習講義共用工具（分數／指數排版、選擇題 mc、表格）===== */
var UID=0;
function f1(x){return (Math.round(x*10)/10).toString();}
function T(x,y,t,cls,anchor){return '<text class="'+(cls||'lbl')+'" x="'+f1(x)+'" y="'+f1(y)+'" text-anchor="'+(anchor||'start')+'">'+t+'</text>';}
function P(b,e){return b+'<sup>'+e+'</sup>';}
function fr(n,d){return '<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>';}
function FP(n,d,e,neg){return '<span class="fp">(</span>'+(neg?'−':'')+fr(n,d)+'<span class="fp">)</span>'+(e!==undefined?'<sup>'+e+'</sup>':'');}
/* 選擇題：選項順序依題目文字固定洗牌（每次開啟順序相同），避免正解總在同一個位置。用 Math.imul 做乘法，h*1103515245 超過 2^53 會失去低位元，洗牌會偏向 */
function mc(q,o,a,w,exp){
  var h=7,i,idx=o.map(function(_,k){return k;});
  for(i=0;i<q.length;i++)h=(h*31+q.charCodeAt(i))>>>0;
  for(i=idx.length-1;i>0;i--){h=(Math.imul(h,1103515245)+12345)>>>0;var j=(h>>>8)%(i+1),t=idx[i];idx[i]=idx[j];idx[j]=t;}
  return [q,exp,{o:idx.map(function(k){return o[k];}),w:idx.map(function(k){return w[k];}),a:idx.indexOf(a)}];
}
function tbl(head,rows){
  var h='<table class="t"><tr>'+head.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr>';
  rows.forEach(function(r){h+='<tr>'+r.map(function(x){return '<td>'+x+'</td>';}).join('')+'</tr>';});
  return h+'</table>';
}
function eq(h){return '<div class="eq">'+h+'</div>';}

var AI='<span class="ai">💡 補充說明</span> ',RE='<span class="ai re">🔁 類題</span> ';

/* 定義卡：單位、名詞的定義要一眼看到（頁面上方，粗框） */
function DEF(term,body){return '<div class="def"><div class="dh">📌 定義：'+term+'</div>'+body+'</div>';}

/* 多排、逐欄對齊（每欄置中）：COLS(排1, 排2, …)，每排是字串陣列；不要用全形空格對齊，字寬不同會歪。
   HL(字)＝重點字上色；PA(字)＝括號裡可省略的部分（灰色） */
function HL(x){return '<b class="hl">'+x+'</b>';}
function PA(x){return '<span class="pa">('+x+')</span>';}
function COLS(){var rs=Array.prototype.slice.call(arguments),n=rs[0].length,st=' style="grid-template-columns:repeat('+n+',minmax(2.6em,1fr))"';
  return '<div class="eq cols">'+rs.map(function(r,k){return '<div class="cr r'+k+'"'+st+'>'+r.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div>';}).join('')+'</div>';}

/* RD(字)＝字首字母標紅（k、c、m、μ、n） */
function RD(x){return '<b class="rd">'+x+'</b>';}

/* ===== 第5章 溫度與熱：圖形工具（lib.js 已提供 UID、f1、T、mc、tbl、eq、DEF、HL、AI、RE）===== */
function mk(id){
  var c=[['a','var(--ac)'],['b','var(--ac3)'],['c','var(--ac2)'],['d','var(--sub)'],['e','var(--bad)'],['k','currentColor']];
  return '<defs>'+c.map(function(m){return '<marker id="'+id+m[0]+'" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto-start-reverse"><path d="M0,1 L12,6.5 L0,12 Z" fill="'+m[1]+'"/></marker>';}).join('')+'</defs>';
}
var CL={a:'var(--ac)',b:'var(--ac3)',c:'var(--ac2)',d:'var(--sub)',e:'var(--bad)',k:'currentColor'};
/* 線段：col 顏色代號 a/b/c/d/e/k，m 箭頭代號 */
function LN(x1,y1,x2,y2,col,w,id,m,dash){
  return '<line x1="'+f1(x1)+'" y1="'+f1(y1)+'" x2="'+f1(x2)+'" y2="'+f1(y2)+'" stroke="'+(CL[col]||col)+'" stroke-width="'+(w||2.5)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+(m?' marker-end="url(#'+id+m+')"':'')+'/>';
}
function PL(pts,col,w,dash,id,m){
  return '<polyline fill="none" stroke="'+(CL[col]||col)+'" stroke-width="'+(w||3.2)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+(m?' marker-end="url(#'+id+m+')"':'')+' stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return f1(p[0])+','+f1(p[1]);}).join(' ')+'"/>';
}
/* 有顏色的字（預設 18px 粗體） */
function TC(x,y,t,col,anchor,cls){return '<text class="'+(cls||'lbl2')+'" x="'+f1(x)+'" y="'+f1(y)+'" text-anchor="'+(anchor||'start')+'" style="fill:'+(CL[col]||col)+'">'+t+'</text>';}
function RC(x,y,w,h,fill,op,stroke,rx){return '<rect x="'+f1(x)+'" y="'+f1(y)+'" width="'+f1(w)+'" height="'+f1(h)+'" rx="'+(rx||0)+'" fill="'+(fill||'none')+'"'+(op!==undefined?' fill-opacity="'+op+'"':'')+(stroke?' stroke="'+stroke+'" stroke-width="2"':'')+'/>';}
function SVG(W,H,aria,cls){return '<svg class="fig big x18'+(cls?' '+cls:'')+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+aria+'">';}

/* 座標圖：o.x=[最小,最大,間隔] o.y=[…] o.xl o.yl 軸名；o.lines=[{p:[[x,y]…],c:'a',t:'甲',at:[x,y],an:'start',dash}]
   o.noxt／o.noyt 不標刻度數字；o.xt(v)／o.yt(v) 自訂刻度文字；o.extra(X,Y) 額外圖形 */
function chart(o){
  var W=o.W||420,H=o.H||320,ml=o.ml||58,mb=o.mb||68,mt=o.mt||40,mr=o.mr||30,pw=W-ml-mr,ph=H-mt-mb,v,
      X=function(v){return ml+(v-o.x[0])/(o.x[1]-o.x[0])*pw;},
      Y=function(v){return H-mb-(v-o.y[0])/(o.y[1]-o.y[0])*ph;},
      id='c'+(++UID),s=SVG(W,H,o.aria||'關係圖')+mk(id);
  for(v=o.x[0];v<=o.x[1]+1e-9;v+=o.x[2]){
    if(!o.nogrid)s+=LN(X(v),mt,X(v),H-mb,'var(--line)',1);
    if(!o.noxt)s+=T(X(v),H-mb+24,o.xt?o.xt(v):v,'lbl2','middle');
  }
  for(v=o.y[0];v<=o.y[1]+1e-9;v+=o.y[2]){
    if(!o.nogrid)s+=LN(ml,Y(v),W-mr,Y(v),'var(--line)',1);
    if(!o.noyt)s+=T(ml-8,Y(v)+6,o.yt?o.yt(v):v,'lbl2','end');
  }
  s+=LN(ml,H-mb,W-mr+14,H-mb,'k',2.5,id,'k')+LN(ml,H-mb,ml,mt-22,'k',2.5,id,'k');
  s+=T(W-4,H-6,o.xl||'時間','lbl2','end')+T(ml+8,mt-20,o.yl||'溫度','lbl2','start');
  if(o.extra)s+=o.extra(X,Y,id);
  (o.lines||[]).forEach(function(l){
    s+=PL(l.p.map(function(p){return [X(p[0]),Y(p[1])];}),l.c,l.w,l.dash);
    if(l.t)s+=TC(X(l.at[0]),Y(l.at[1]),l.t,l.c,l.an);
  });
  return s+'</svg>';
}

/* 三個盆子＋兩隻手：感官判斷冷熱 */
function handsFig(){
  var id='h'+(++UID),W=460,H=250,s=SVG(W,H,'左右手先泡熱水和冰水，再放進溫水')+mk(id);

    s+='<path d="M'+q[0]+' 130 L'+(q[0]+10)+' 200 L'+(q[0]+100)+' 200 L'+(q[0]+110)+' 130" fill="'+CL[q[2]]+'" fill-opacity=".22" stroke="currentColor" stroke-width="2.5"/>';
    s+=TC(q[0]+55,235,q[1],q[2],'middle');
  });
  s+='<path d="M75 120 Q120 50 205 118" fill="none" stroke="var(--ac)" stroke-width="3" marker-end="url(#'+id+'a)"/>';
  s+='<path d="M385 120 Q340 50 255 118" fill="none" stroke="var(--ac3)" stroke-width="3" marker-end="url(#'+id+'b)"/>';

}

/* 三支溫度計：攝氏、華氏、自製 */
function scaleFig(){
  var W=470,H=320,y1=60,y0=250,s=SVG(W,H,'攝氏、華氏、自製溫標對照');
  var c=[[70,'攝氏 ℃','100','0','C','a'],[230,'華氏 ℉','212','32','F','b'],[390,'自製 °X','B','A','X','c']];
  s+=LN(20,y1,450,y1,'d',1.6,0,0,'6 5')+LN(20,y0,450,y0,'d',1.6,0,0,'6 5');
  s+=T(310,y1-8,'水的沸點','lbl2','middle')+T(310,y0-8,'水的熔點','lbl2','middle');
  s+=LN(20,150,450,150,'e',2,0,0,'3 4');
  c.forEach(function(q){
    s+='<rect x="'+(q[0]-9)+'" y="34" width="18" height="236" rx="9" fill="var(--card)" stroke="currentColor" stroke-width="2.2"/><circle cx="'+q[0]+'" cy="280" r="15" fill="var(--bad)" fill-opacity=".6" stroke="currentColor" stroke-width="2.2"/>';
    s+=RC(q[0]-4,150,8,130,'var(--bad)',.6);
    s+=TC(q[0]-16,y1+6,q[2],q[5],'end')+TC(q[0]-16,y0+6,q[3],q[5],'end')+TC(q[0]+16,156,q[4],'e','start');
    s+=TC(q[0],22,q[1],q[5],'middle');

}

/* 溫度計可量的範圍（數線） */
function rangeFig(){
  var W=470,H=210,X=function(v){return 40+(v+150)/550*400;},s=SVG(W,H,'水銀與酒精溫度計可量的範圍');
  s+=LN(X(-150),160,X(400),160,'k',2.2);
  [-100,0,100,200,300,400].forEach(function(v){s+=LN(X(v),154,X(v),166,'k',2)+T(X(v),190,v,'lbl2','middle');});
  s+=RC(X(-37),50,X(357)-X(-37),30,'var(--ac3)',.55)+TC(X(-37)+6,72,'水銀 −37～357','k','start');
  s+=RC(X(-114),100,X(78)-X(-114),30,'var(--ac)',.55)+TC(X(-114)+6,122,'酒精 −114～78','k','start');
  s+=LN(X(-40),30,X(-40),160,'e',2,0,0,'5 4')+TC(X(-40),24,'南極 −40','e','middle');
  s+=LN(X(100),30,X(100),160,'c',2,0,0,'5 4')+TC(X(100)+6,24,'沸水 100','c','start');
  return s+'</svg>';
}

function heatFlowFig(){
  var id='q'+(++UID),W=460,H=230,s=SVG(W,H,'熱由高溫的物體傳到低溫的物體')+mk(id);
  s+=RC(30,60,130,100,'var(--ac)',.28,'currentColor',10)+TC(95,120,'80℃','a','middle');
  s+=RC(270,40,160,140,'var(--ac3)',.22,'currentColor',10)+TC(350,120,'20℃','b','middle');
  s+=T(95,186,'甲：小杯','lbl2','middle')+T(350,206,'乙：大桶','lbl2','middle');
  s+=LN(168,110,258,110,'e',4,id,'e')+TC(213,98,'熱','e','middle');
  s+=TC(230,24,'熱從溫度高的傳到溫度低的','k','middle');
  return s+'</svg>';
}
function breezeFig(){
  var id='w'+(++UID),W=540,H=270,s=SVG(W,H,'白天吹海風、晚上吹陸風')+mk(id);
  [[0,1],[280,0]].forEach(function(q){
    var x=q[0],day=q[1],hot=day?'陸（較暖）':'海（較暖）';
    s+=RC(x,205,130,60,'var(--ac3)',.3)+'<polygon points="'+(x+130)+',195 '+(x+260)+',195 '+(x+260)+',265 '+(x+130)+',265" fill="var(--ac)" fill-opacity=".25"/>';
    s+=T(x+65,245,day?'海（較冷）':'海（較暖）','lbl2','middle')+T(x+195,245,day?'陸（較暖）':'陸（較冷）','lbl2','middle');
    s+=TC(x+10,26,day?'☀ 白天':'☾ 晚上',day?'a':'b','start');
    var up=day?x+195:x+65,dn=day?x+65:x+195;
    s+=LN(up,178,up,95,'e',3,id,'e')+LN(up,80,dn,80,'d',3,id,'d')+LN(dn,95,dn,178,'b',3,id,'b')+LN(dn,190,up,190,'b',3.5,id,'b');
    s+=TC((up+dn)/2,183,day?'海風':'陸風','b','middle')+T(up+(day?-8:8),130,'熱空氣上升','lbl',day?'end':'start');
  });
  return s+'</svg>';
}

B({t:'同一個熱源：加熱時間 ∝ 熱量',tag:'超重要',src:'講義 p.237（C. 熱量變化公式 2.(1)～(5)）',

B({t:'比例題：設數字最快',src:'講義 p.241（精選範例 8、類題 1、3）、p.242（精選範例 9）',

B({t:'📌補充：熱容量（高中銜接）',tag:'📌 補充',src:'講義 p.243（高中銜接框）、p.242（精選範例 10）',

B({t:'冷熱混合：放熱＝吸熱',tag:'超重要',src:'講義 p.244（D. 2 冷熱混合）、p.244～245（精選範例 11、類題 1、2）、自修 p.218（例 3）',

 qs:[[RE+'80℃ 的熱水 40 g 和 20℃ 的冷水混合，最後 50℃（不計散失）。冷水幾 g？','① 熱水放熱 ＝ 40 × 1 × (80 − 50) ＝ 1200 卡<br>② 冷水吸熱 ＝ m × 1 × (50 − 20) ＝ 30m<br>③ 放熱 ＝ 吸熱：30m ＝ 1200<br>④ m ＝ 40<br>答：40 g。（講義 p.244 類題 1 換數字）'],[RE+'30℃、200 g 的 A 液體和 70℃、100 g 的水混合，最後 46℃。A 的比熱？','① 水放熱 ＝ 100 × 1 × (70 − 46) ＝ 2400 卡<br>② A 吸熱 ＝ 200 × S × (46 − 30) ＝ 3200 × S<br>③ 3200 × S ＝ 2400<br>④ S ＝ 0.75<br>答：0.75 cal/(g・℃)。（講義 p.245 類題 2 換數字）']]});

B({t:'冷熱水混合實驗室',tag:'💡 互動',src:'自己做的互動頁，用講義 p.244 的冷熱混合公式計算（不計散失）',
 text:'<div style="display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center"><span style="color:var(--ac)"><b>熱水質量</b></span><input type="range" id="mxA" min="10" max="200" step="10" value="100"><b id="mxAv"></b><span style="color:var(--ac)"><b>熱水溫度</b></span><input type="range" id="mxB" min="40" max="100" step="5" value="80"><b id="mxBv"></b><span style="color:var(--ac3)"><b>冷水質量</b></span><input type="range" id="mxC" min="10" max="200" step="10" value="100"><b id="mxCv"></b><span style="color:var(--ac3)"><b>冷水溫度</b></span><input type="range" id="mxD" min="0" max="35" step="5" value="20"><b id="mxDv"></b></div><div id="mxO" class="q"></div>試試看：兩杯一樣多時，平衡溫度剛好在正中間嗎？',
 init:function(){var g=function(i){return document.getElementById(i);};if(!g('mxA'))return;
  function u(){var a=+g('mxA').value,b=+g('mxB').value,c=+g('mxC').value,d=+g('mxD').value,t=(a*b+c*d)/(a+c);
   g('mxAv').textContent=a+' g';g('mxBv').textContent=b+'℃';g('mxCv').textContent=c+' g';g('mxDv').textContent=d+'℃';
   g('mxO').innerHTML='平衡溫度 T ＝ <b>'+f1(t)+'℃</b><br><span style="font-size:1rem">熱水放熱 '+a+' × 1 × ('+b+' − T) ＝ 冷水吸熱 '+c+' × 1 × (T − '+d+')<br>熱水放出 '+f1(a*(b-t))+' 卡，冷水吸收 '+f1(c*(t-d))+' 卡，一樣多</span>';}
  ['mxA','mxB','mxC','mxD'].forEach(function(i){g(i).oninput=u;});u();},
 note:'這頁只算「水和水」混合（比熱都是 1）。不同物質混合時，還要乘上各自的比熱。'});

B({t:'小結：5-2 你應該帶走的',tag:'完成',src:'整理講義 p.231～246',
 text:'<ul><li>熱由<b>溫度</b>高傳到低，直到溫度相同（熱平衡）</li><li>1 卡：1 g 水升 1℃；1 大卡 ＝ 1000 卡；只能說熱量「變化」</li><li>比熱 S：1 g 物質升高 1℃ 要吸收的熱；水的比熱是 1；物質的比熱越大 → 這個物質的溫度越難升高、也越難降低</li><li><b>H ＝ m × S × ΔT</b>；用同一個熱源時：H ＝ 每分鐘給的熱 × 加熱時間</li><li>用同一個熱源加熱同樣的時間 → 兩個物體吸的熱一樣多；在「溫度—時間」圖上，線越陡 → 這個物體的 m × S 越小</li><li>混合：放熱 ＝ 吸熱（＋散失）；平衡溫度在兩者之間</li></ul>接下來是隨堂演練 28、29 的詳解。'});

/* ---------- C：5-3 熱對物質的影響 ---------- */
function lakeFig(){
  var W=500,H=290,s=SVG(W,H,'冬天和夏天湖水各層的溫度');
  [[0,'冬天','氣溫 −10℃',['0℃','1℃','2℃','3℃','4℃'],'b'],[260,'夏天','氣溫 35℃',['25℃','20℃','15℃','10℃','4℃'],'a']].forEach(function(q){
    var x=q[0];
    s+=TC(x+10,24,q[1],q[4],'start')+T(x+230,24,q[2],'lbl2','end');
    s+=RC(x+10,50,230,225,'var(--ac3)',.18,'currentColor');
    if(q[1]==='冬天')s+=RC(x+10,50,230,22,'var(--sub)',.35)+T(x+20,67,'冰','lbl2','start');
    q[3].forEach(function(t,k){var y=(q[1]==='冬天'?96:82)+k*(q[1]==='冬天'?40:42);s+=T(x+225,y,t,'lbl2','end')+LN(x+20,y-6,x+150,y-6,'d',1,0,0,'4 5');});
    s+=TC(x+20,265,'湖底約 4℃','k','start');
  });
  return s+'</svg>';
}
function bimetalFig(){
  var W=460,H=250,s=SVG(W,H,'雙金屬片受熱彎曲');
  s+=RC(20,30,24,50,'var(--sub)',.8)+RC(44,40,360,12,'var(--ac)',.85)+RC(44,52,360,12,'var(--ac3)',.85);
  s+=TC(410,44,'鋁','a','start')+TC(410,80,'銅','b','start')+T(230,104,'加熱前：平的','lbl2','middle');
  s+=RC(20,140,24,50,'var(--sub)',.8);
  s+='<path d="M44 160 Q230 150 392 222" fill="none" stroke="var(--ac)" stroke-width="12"/><path d="M44 172 Q226 162 386 233" fill="none" stroke="var(--ac3)" stroke-width="12"/>';
  s+=TC(450,162,'鋁在外側（膨脹多）','a','end')+TC(150,215,'彎向銅','b','middle');
  return s+'</svg>';
}
function stateTri(){
  var id='s'+(++UID),W=460,H=330,s=SVG(W,H,'三態變化與吸熱放熱')+mk(id),
      P={固:[230,62],液:[78,272],氣:[382,272]},r=36;
  function ar(a,b,lab,col,off,lo){
    var x1=P[a][0],y1=P[a][1],x2=P[b][0],y2=P[b][1],dx=x2-x1,dy=y2-y1,l=Math.sqrt(dx*dx+dy*dy),ux=dx/l,uy=dy/l,nx=-uy*off,ny=ux*off;
    var o=LN(x1+ux*(r+6)+nx,y1+uy*(r+6)+ny,x2-ux*(r+8)+nx,y2-uy*(r+8)+ny,col,3,id,col);
    var mx=(x1+x2)/2+nx*lo,my=(y1+y2)/2+ny*lo+6;
    return o+TC(mx,my,lab,col,'middle');
  }
  s+=ar('固','液','熔化','a',-9,4)+ar('液','固','凝固','b',-9,4);
  s+=ar('液','氣','汽化','a',-9,3.4)+ar('氣','液','凝結','b',-9,3.4);
  s+=ar('氣','固','凝華','b',-9,4)+ar('固','氣','昇華','a',-9,4);
  ['固','液','氣'].forEach(function(k){s+='<circle cx="'+P[k][0]+'" cy="'+P[k][1]+'" r="'+r+'" fill="var(--soft)" stroke="currentColor" stroke-width="2.5"/>'+T(P[k][0],P[k][1]+7,k+'體','lbl2','middle');});
  s+=TC(10,22,'橘色：吸熱','a','start')+TC(450,22,'藍色：放熱','b','end');
  return s+'</svg>';
}

C({t:'雙金屬片：受熱會彎',tag:'重點',src:'講義 p.254（A. 5 與圖、精選範例 2）、自修 p.229',

C({t:'金屬球和環、生活應用',src:'講義 p.254（A. 6、7）、自修 p.229～230',

C({t:'化學變化與能量：吸熱、放熱',tag:'重點',src:'講義 p.255（B. 1～3）、自修 p.236（7 吸熱反應與放熱反應）',

 text:'物質吸熱或放熱後，只會發生其中一種：<ul><li>狀態<b>改變</b>，溫度<b>不變</b></li><li>溫度<b>改變</b>，狀態<b>不變</b></li></ul>一大氣壓下，<b>冰水混合</b>（冰還沒融完）時，溫度一定是 <b>0℃</b>。',
 sheet:'講義 p.257：2. 物質吸收或放出熱量後，可能：狀態【改變】，溫度【不變】；溫度【改變】，狀態【不變】。',
 qs:[[RE+'一杯冰塊還沒完全融化的冰水放在 6℃ 的冰箱冷藏室很久，冰塊還在。水溫幾度？','0℃。冰水共存，溫度就是 0℃。（講義 p.259 類題 1 換數字）'],['一大氣壓下，甲：杯中全結冰；乙：水和大量冰塊；丙：水和少量冰塊；丁：只有水。哪一杯可能是 4℃？','丁。乙、丙有冰也有水，都是 0℃；甲全是冰，0℃ 以下。（講義 p.259 精選範例 5，109 會考）']]});

C({t:'蒸發和沸騰；壓力影響沸點',tag:'重點',src:'講義 p.257（C. 3、4）、p.259（精選範例 4、類題 1）、自修 p.234',
 text:tbl(['','蒸發','沸騰'],[['什麼溫度','<b>任何溫度</b>都會','到<b>沸點</b>才會'],['發生在哪','液體<b>表面</b>','液體<b>內部</b>也會（冒泡）'],['快慢','和緩','劇烈']])+'蒸發變快：液面大、溫度高、空氣乾燥、有風。<br><br>壓力越<b>大</b>，沸點越<b>高</b>；壓力越<b>小</b>，沸點越<b>低</b>。<ul><li>高山上氣壓小，水不到 100℃ 就沸騰，不容易煮熟</li><li>壓力鍋把壓力加大 → 沸點升高 → 容易煮熟</li><li>桶裝瓦斯加壓，把氣體變成液化石油氣</li></ul>',
 sheet:'講義 p.257：3. 汽化：【蒸發】任何溫度下，表面液體分子和緩 → 氣體分子 (1) 液面大 (2) 溫度高 (3) 乾燥 (4) 有風，蒸發快；【沸騰】在沸點時，內部液體分子急遽 → 氣體分子。4. (1) 環境壓力愈大 ⇒ 沸點愈【高】；愈小 ⇒ 沸點愈【低】。',
 qs:[['酒精沸點 78.5℃，30℃、50℃ 時會蒸發嗎？','都會。蒸發在任何溫度都會發生。（講義 p.259 精選範例 4、隨堂演練 30 第 2 題）'],['同質量的水 80℃、40℃、60℃、20℃，哪一杯蒸發最快？','80℃，溫度越高蒸發越快。（講義 p.259 類題 1）']]});

C({t:'用熔點、沸點判斷狀態',src:'講義 p.258（精選範例 2、類題 1、高中銜接框）',
 text:'一大氣壓下：'+tbl(['溫度在哪裡','狀態'],[['低於熔點','固態'],['等於熔點','可能固液共存'],['在熔點和沸點之間','液態'],['等於沸點','可能液氣共存'],['高於沸點','氣態']]),
 qs:[[RE+'某物質在 −60℃ 是固體、0℃ 是液體、200℃ 是氣體。表中哪一個可能？甲：熔點 −80、沸點 150；乙：熔點 −40、沸點 300；丙：熔點 −50、沸點 180；丁：熔點 10、沸點 250','丙。<br>① −60℃ 是固體 → 熔點要高於 −60：甲（−80）不行<br>② 0℃ 是液體 → 熔點要低於 0、沸點高於 0：丁（10）不行<br>③ 200℃ 是氣體 → 沸點要低於 200：乙（300）不行<br>④ 只剩丙（−50、180）。（講義 p.258 精選範例 2 換數字）']],
 note:'📌 講義 p.258 高中銜接：冰的熔化熱 80 卡／公克、水的汽化熱 540 卡／公克（融化 1 g 的冰要 80 卡，溫度不變）。'});

C({t:'三態判斷：看吸熱放熱的方向',src:'講義 p.258（精選範例 3）、p.259（類題 1）',
 text:'三種狀態中：<ul><li><b>氣態</b>變成另外兩種都是<b>放熱</b></li><li><b>固態</b>變成另外兩種都是<b>吸熱</b></li><li>液態在中間：變固態放熱、變氣態吸熱</li></ul>',
 qs:[mc('甲、乙、丙是三種狀態，箭頭表示放熱：甲 → 乙、甲 → 丙、乙 → 丙都是放熱。甲、乙、丙是？',['甲氣、乙固、丙液','甲氣、乙液、丙固','甲固、乙氣、丙液','甲固、乙液、丙氣'],1,
   ['乙 → 丙 是固變液，要吸熱，不是放熱。','','固態變氣態要吸熱。','固態變液態要吸熱。'],
   '甲變成其他兩種都放熱 → 甲是氣態；乙 → 丙 放熱 → 液變固，乙液、丙固。（講義 p.258 精選範例 3，110 會考）')]});

C({t:'看懂冰的加熱曲線',src:'講義 p.260（精選範例 6）',
 fig:chart({x:[0,20,4],y:[-20,120,20],xl:'時間(分)',yl:'溫度(℃)',aria:'50 克冰的加熱曲線',

 qs:[['(1) 水從 0℃ 加熱到 100℃（C → D）吸了多少熱？','H ＝ 50 × 1 × (100 − 0) ＝ 5000 卡。'],['(2) 熱源每分鐘提供多少熱？','C → D 用 19 − 9 ＝ 10 分鐘 → 5000 ÷ 10 ＝ 500 卡／分鐘。'],['(3) 加熱 5 分鐘時是什麼狀態？','第 1～9 分鐘在 0℃ 的水平段 → 固液共存。'],['(4) B → C 這段吸了多少熱？','用了 9 − 1 ＝ 8 分鐘 × 500 ＝ 4000 卡（＝ 50 g × 80 卡／g，熔化熱）。']],

C({t:'生活中的凝結：小水珠',src:'講義 p.260（精選範例 7）、p.261（類題 1、2）、自修 p.238',
 text:'空氣中的<b>水蒸氣</b>碰到<b>比較冷</b>的東西 → 放熱<b>凝結</b>成小水滴。<ul><li>冰水杯：杯子<b>外壁</b>出現水珠（外面空氣的水蒸氣碰到冷杯子）</li><li>熱水杯：杯子<b>內壁、水面以上</b>出現水珠（熱水蒸發的水蒸氣碰到較冷的杯壁）</li><li>戴眼鏡吃熱麵，鏡片起霧；冬天車窗內起霧（車內水氣）</li><li>雲：水滴或冰晶</li><li>冬天吐出的白煙、冰箱冒的白煙、乾冰的白煙 → 都是<b>小水滴</b>（不是水蒸氣，水蒸氣看不見）</li></ul>',
 qs:[['室溫 25℃，一杯 0℃ 的冰水、一杯 100℃ 的熱水，各在哪裡先出現霧狀小水珠？','冰水杯：外壁；熱水杯：內壁水面以上。（講義 p.260 精選範例 7，96 基測）'],['點香菸冒的白煙和冬天吐的白煙一樣嗎？','不一樣。香菸的白煙是燃燒產生的微粒，其他是水蒸氣凝結的小水滴。（隨堂演練 30 第 16 題）']]});

C({t:'小結：5-3 你應該帶走的',tag:'完成',src:'整理講義 p.253～261',
 text:'<ul><li>熱脹冷縮的程度：氣體 &gt; 液體 &gt; 固體；水在 <b>4℃ 時體積最小、密度最大</b>，所以冬天湖底約 4℃</li><li>雙金屬片：受熱時彎向膨脹<b>少</b>的那一邊</li><li>金屬環加熱，中間的洞也變<b>大</b>；鐵軌要留縫、電線不能拉太緊</li><li>反應吸熱 → 周圍變冷；反應放熱 → 周圍變熱；名稱有「凝」字的狀態變化（凝固、凝結、凝華）都放熱</li><li>硫酸銅失去水：藍色 → 白色；氯化亞鈷失去水：粉紅色 → 藍色（可以用來檢驗有沒有水）</li><li>熔化、沸騰時一直吸熱，但<b>溫度不變</b>；一大氣壓下冰水共存時是 0℃</li><li>蒸發在任何溫度都會發生；環境壓力越大 → 液體的沸點越高</li></ul>接下來是隨堂演練 30 的詳解。'});

C({t:'📝 隨堂演練 30（1～4）',tag:'作業解答',src:'講義 p.262 隨堂演練 30 第 1～4 題',
 qs:[HW(1,'水在哪一種狀態變化中會放出熱量？','(B) 大氣中的水氣凝結成雲','凝結放熱。雪融化（熔化）、水蒸發、霧變水蒸氣（汽化）都是吸熱。'),
  HW(2,'酒精沸點 78.5℃，在 30℃、50℃ 時會蒸發嗎？','(D) 30℃ 與 50℃ 皆會','蒸發在任何溫度都會發生，不用到沸點。'),
  HW(3,'哪一個圖表示純物質<b>熔化</b>過程的溫度—時間曲線？','(B) 上升 → 水平 → 上升','熔化時一直吸熱但溫度不變 → 中間有水平段。(A) 是突然往上跳，(C) 沒有水平段，(D) 是在降溫。'),
  HW(4,'相同熱源加熱等質量的甲、乙、丙固體（圖：甲最陡、最先到水平段，乙其次，丙最緩）。固態時比熱最小的是？','(A) 甲','看第一段（固態）的斜率：同質量、同熱源，升溫越快比熱越小。甲最陡 → 比熱最小。')]});

var HW30=[
 HW(5,'250 g、10℃ 的固體，熱源每分鐘 100 卡。圖：0～10 分 10→40℃、10～40 分 40℃ 不變、40～60 分 40→60℃。何者正確？','講義印的四個選項算出來都對不上，上課請問老師',
  STEP+'① 固態（0～10 分）：吸熱 100 × 10 ＝ 1000 卡，ΔT ＝ 40 − 10 ＝ 30℃<br>　 S ＝ 1000 ÷ (250 × 30) ＝ 1000 ÷ 7500 ≈ 0.13<br>② 液態（40～60 分）：吸熱 100 × 20 ＝ 2000 卡，ΔT ＝ 60 − 40 ＝ 20℃<br>　 S ＝ 2000 ÷ (250 × 20) ＝ 2000 ÷ 5000 ＝ 0.4<br>③ 選項是：(A) 固態 0.2、(B) 固態 0.4、(C) 液態 0.2、(D) 液態 0.1，沒有一個等於「固態約 0.13」或「液態 0.4」。<br>'+WARN+'最接近的是「液態 0.4」，但 (B) 寫的是「固態」。可能是題目印錯，請上課確認。'),
 HW(6,'100 g、10℃ 的固體，穩定熱源加熱。圖：0～10 分 10→30℃、10～60 分 30℃ 不變、60～80 分 30→50℃、80 分後 50℃ 不變。何者<b>錯誤</b>？','照講義的圖，(C) 和 (D) 都是錯的；選項應該是照另一張圖出的，原本的答案應為 (D)',
  STEP+'照講義的圖：<br>① 0～10 分：固態升溫 → (A) 0～9 分固態 ✔<br>② 10～60 分：30℃ 水平段，固液共存 → (B) 10～39 分固液共存 ✔<br>③ 40～59 分還在 30℃ 的水平段，仍是固液共存 → (C)「液態」✘<br>④ 80 分才到 50℃ 的第二個水平段（沸點）→ (D)「第 50 分達沸點」✘<br>'+WARN+'選項的分鐘數（10、40、60）和第 5 題的圖一樣，看起來是照「10 分熔化、40 分熔化完、60 分沸騰」的圖出的；那樣的話 (C) 對、(D) 錯，答案是 (D)。請上課確認。')];

C({t:'📝 隨堂演練 30（7～11）',tag:'作業解答',src:'講義 p.263 隨堂演練 30 第 7～11 題',
 qs:[HW(7,'皮膚塗酒精後覺得涼涼的，為什麼？','(D) 酒精揮發時會吸收皮膚表面的熱量','蒸發（汽化）吸熱，熱從皮膚被帶走。'),
  HW(8,'有關熱脹冷縮的例子，何者<b>錯誤</b>？','(B) 玻璃罐打不開，把金屬瓶蓋放在冰水下沖，瓶蓋收縮、內徑增加而打開','冰水讓瓶蓋收縮 → 內徑變<b>小</b>、蓋得更緊。應該用熱水。'),
  HW(9,'哪一項<b>不屬於</b>溫度對物質體積影響的例子？','(B) 固體溶質在高溫時溶解度較高','溶解度和體積無關。(A) 養樂多冷凍後瓶子變形、(C) 鐵軌空隙、(D) 伸縮縫都是體積變化。'),
  HW(10,'有關溫度對物質的影響，何者<b>錯誤</b>？','(D) 溫度從 0℃ 上升至 4℃，水的體積逐漸膨脹','0～4℃ 水是熱縮冷脹，升溫時體積<b>縮小</b>。'),
  HW(11,'水從 0℃ 升到 30℃，體積怎麼變？','(C) 先逐漸減少到最低點，然後再逐漸增加','4℃ 時體積最小。')]});

C({t:'📝 隨堂演練 30（12～15）',tag:'作業解答',src:'講義 p.264 隨堂演練 30 第 12～15 題',
 qs:[HW(12,'固體的熔化曲線（圖：0～2 分 20→55℃，2～6 分 55℃ 不變，之後上升）。何者正確？','(C) 加熱 8 分鐘後，固體已完全熔化為液體',STEP+'① 2～6 分是水平段（熔化），6 分以後全部變液體 → 8 分時是液體 ✔<br>② (A) 前 4 分鐘：20℃ 到 55℃，升 35℃，不是 40℃<br>③ (B) 共存時間 6 − 2 ＝ 4 分鐘，不是 8 分鐘<br>④ (D) 從 20℃ 到熔點 55℃ 要升 35℃，不是 20℃'),
  HW(13,'有關蒸發與沸騰，何者正確？','(A) 兩者都是液體汽化的過程','(B) 說反了：沸騰才要特定溫度；(C) 兩者都吸熱；(D) 都是物理變化。'),
  HW(14,'冰的熔化與水的凝固，何者<b>錯誤</b>？','(C) 冰熔化需要放熱、水凝固需要吸熱','說反了：熔化<b>吸熱</b>、凝固<b>放熱</b>。'),
  HW(15,'寒冷下雨的冬天，車內玻璃一下子就起霧，原因？','(B) 車內水氣凝結成的小水滴','車內較暖、水氣多，碰到被外面冷空氣冰冷的玻璃 → 凝結在<b>內側</b>。')]});

C({t:'📝 隨堂演練 30（16～19）',tag:'作業解答',src:'講義 p.264 隨堂演練 30 第 16～19 題',
 qs:[HW(16,'哪一種白煙的成分和其他三種不同？','(D) 點燃香菸時冒出的白煙','其他三種（冬天吐氣、冷凍庫、乾冰）都是水蒸氣遇冷凝結的小水滴；香菸的白煙是燃燒產生的微粒。'),
  HW(17,'去韓國滑雪，融雪時比下雪時更冷，原因？','(C) 水氣變成雪的過程會放熱，而融雪的過程會吸熱','融雪吸熱，把周圍的熱帶走 → 更冷。'),
  HW(18,'夏季午後雷陣雨前為什麼特別悶熱？','(D) 空氣中水蒸氣凝結成水滴的過程放熱，加上溼度高，人體不易排汗','凝結放熱；溼度高時汗不容易蒸發，熱散不掉。'),
  HW(19,'甲杯加氫氧化鈉水溫升高，乙杯加氯化銨水溫下降。兩杯的反應？','(B) 甲放熱、乙吸熱','周圍（水）變熱 → 放熱；變冷 → 吸熱。')]});

C({t:'📝 隨堂演練 30（20～23）',tag:'作業解答',src:'講義 p.265 隨堂演練 30 第 20～23 題',
 qs:[HW(20,'五元日幣中間有小圓孔，加熱後孔的直徑？','(A) 變大','整個硬幣等比例膨脹，洞也一起變大（像金屬環加熱，洞變大）。'),
  HW(21,'【100 北聯】純乙酸液體從 25℃ 逐漸冷卻，杯內慢慢出現固體，而且沉到杯底。何者正確？','(C) 凝固點（熔點）小於 25℃，固態密度大於液態',STEP+'① 25℃ 時還是液體，冷下來才出現固體 → 凝固點比 25℃ 低<br>② 固體沉到杯底 → 固體密度比液體大（和冰浮在水上相反）'),

  s+='<path d="M210 232 L210 100 Q210 86 196 86 L104 86 Q88 86 88 102 L88 214 Q88 230 104 230 L180 230" fill="none" stroke="var(--ac3)" stroke-width="3" marker-end="url(#'+id+'b)"/>';
  s+='<path d="M210 100 Q210 86 224 86 L316 86 Q332 86 332 102 L332 214 Q332 230 316 230 L240 230" fill="none" stroke="var(--ac3)" stroke-width="3" marker-end="url(#'+id+'b)"/>';
  s+=LN(210,236,210,104,'e',4,id,'e');

  s+=TC(222,160,'熱水上升','e','start')+TC(96,160,'冷水','b','start')+TC(96,184,'下沉','b','start')+TC(250,300,'底部加熱','a','start');

function radFig(){
  var id='r'+(++UID),W=440,H=280,s=SVG(W,H,'火焰上方和旁邊的手怎麼得到熱')+mk(id);
  s+='<path d="M170 250 Q160 200 200 160 Q205 195 220 190 Q235 170 228 145 Q270 190 250 250 Z" fill="var(--ac)" fill-opacity=".75"/>';

  s+='<path d="M270 200 q12 -10 24 0 t24 0 t24 0 t24 0" fill="none" stroke="var(--ac2)" stroke-width="3" marker-end="url(#'+id+'c)"/>';

function thermosFig(){
  var W=460,H=320,s=SVG(W,H,'保溫瓶的構造');

  s+=LN(220,170,262,140,'d',1.5)+TC(268,146,'真空夾層：','k','start')+TC(268,170,'防止傳導和對流','k','start');
  s+=LN(204,240,262,232,'d',1.5)+TC(268,238,'鍍銀：防止輻射','c','start');

  return s+'</svg>';
}

D({t:'傳導：靠接觸，一個傳一個',tag:'重點',src:'講義 p.266（A. 1）、p.267（精選範例 1、類題 1）、自修 p.244～245（2 傳導）',
 text:'<b>傳導</b>：熱經由物體之間的<b>接觸</b>，從高溫傳到低溫；<b>固體</b>主要靠傳導。'+tbl(['傳熱快慢','例子'],[['固體 &gt; 液體 &gt; 氣體','棉被蓬鬆有很多空氣，空氣不易傳熱 → 保暖'],['金屬 &gt; 非金屬','鍋子用金屬，把手用木頭、塑膠'],['最好是<b>銀</b>，其次是<b>銅</b>','']])+'室溫下，金屬摸起來比木頭冰 → 不是金屬比較冷，是金屬<b>導熱快</b>，把手的熱很快帶走。<br>⚠️ 比熱小只代表溫度易升易降，<b>不一定</b>導熱快。',
 sheet:'講義 p.266：1.【傳導】：固體的主要傳熱方式 (1) 熱經由物體之間的「接觸」，由溫度高的地方，經由物體傳遞到溫度低的地方的現象 (2) 比熱小的物質，溫度易升易降，但不一定導熱快 (3) 傳導快慢：① 固體＞液體＞氣體 ② 金屬＞非金屬 ③ 熱傳導效果最好的物質是銀，其次是銅。(4) ① 金屬可用來當做鍋子的材料，而木頭、塑膠等，則用來當做把手的材料 ② 室溫下，相同溫度的金屬摸起來比木頭冷，就是由於金屬導熱較快 ③ 棉被蓬鬆充滿了空氣，而空氣導熱率是較低的，所以容易保暖。',

   '木棒不易導熱，摩擦的熱留在接觸點，溫度才能升到木材燃燒。（講義 p.267 精選範例 1，96 基測）'),
  ['冬天室溫下摸金屬門把、木桌、保麗龍，冷的感覺由強到弱。可以推論什麼？','熱傳導能力：金屬門把 &gt; 木桌 &gt; 保麗龍。三者溫度其實一樣（都是室溫）。（講義 p.267 類題 1，98 基測）']]});

D({t:'對流：熱的往上，冷的往下',tag:'重點',src:'講義 p.266（A. 2 與圖）、自修 p.245～246（3 對流）',
 fig:convFig(),
 text:'<b>對流</b>：<b>液體、氣體</b>（流體）的主要傳熱方式，靠上下<b>循環流動</b>。<br>燒水時，壺底的水受熱 → 體積變大、<b>密度變小 → 上升</b>；周圍的冷水下來補位，一直循環，整壺水就熱了。<br>應用：<ul><li><b>電暖器</b>裝在<b>低</b>處：熱空氣往上升</li><li><b>冷氣機</b>裝在<b>高</b>處：冷空氣往下沉</li><li>熱氣球、天燈：熱空氣上升</li><li>煙囪做得高：對流旺盛，廢氣容易排出</li></ul>',
 sheet:'講義 p.266：2.【對流】：流體的主要傳熱方式 (1) 在液體或氣體，以上下循環運動的方式來傳遞熱量 (2) 燒水時，水壺底部水受熱而體積變大、密度變小而上升，周圍的冷水就會填補底部上升的熱水所占的空間，如此反覆進行就可以把熱傳開 (3) ① 電熱器裝在地面，熱空氣上升，使得房間迅速溫暖 ② 冷氣機裝在高處，冷空氣下沉，冷房效果較好 ③ 熱氣球、天燈都是利用空氣的對流使其升空。',
 qs:[['兩支相同的試管裝等量的水，左邊從<b>底部</b>加熱、右邊從<b>上方</b>加熱。哪一支的水整支比較快熱？','底部加熱的。熱水往上升，形成對流，整支都熱；上方加熱時熱水留在上面，下面只能靠水的傳導（水傳熱很慢），底部幾乎不熱。（講義 p.267 類題 1、隨堂演練 31 第 4 題）']]});

D({t:'對流的方向題',src:'講義 p.267（精選範例 2）、p.268（類題 2）',

/* ===== 播放 ===== */
var deck='A',cur=0,QM={};
function pageMarked(d,n){var p=d+n;for(var k in QM)if(k===p||k.indexOf(p+':')===0)return true;return false;}
function el(i){return document.getElementById(i);}
var h='';
Object.keys(DECKS).forEach(function(k){
  DECKS[k].SL.forEach(function(s,i){
    h+='<section class="slide" id="s'+k+i+'"><span class="tag'+(s.tag&&/^(📌|💡)/.test(s.tag)?' sup':'')+'">'+(s.tag||('步驟 '+(i+1)))+'</span><h1>'+s.t+'</h1><button class="mk" data-k="'+k+i+'">❓ 這頁有問題</button>'+(s.src?'<div class="src">📖 出處：'+s.src+'</div>':'');
    /* 橫放平板：有圖的頁圖在左、文字在右；沒圖但有文字＋想一想：文字在左、想一想在右（見 CSS .sbody.two） */
    var tq=!s.fig&&s.qs&&s.text;
    h+='<div class="sbody'+(s.fig?' two':(tq?' two tq':''))+'">';
    if(s.fig)h+='<div class="sfig">'+s.fig+'</div>';
    else if(tq)h+='<div class="sfig"><div class="txt">'+s.text+'</div>'+(s.sheet?'<div class="sheet">✍️ <b>對照講義</b>：'+s.sheet+'</div>':'')+'</div>';
    h+='<div class="stxt">';
    if(s.text&&!tq)h+='<div class="txt">'+s.text+'</div>';
    if(s.sheet&&!tq)h+='<div class="sheet">✍️ <b>對照講義</b>：'+s.sheet+'</div>';
    if(s.qs){h+='<div class="qs'+(s.qs.length>2&&!s.fig&&!tq?' qgrid':'')+'">';s.qs.forEach(function(q,qi){h+='<div class="q" id="q'+k+i+'_'+qi+'"><button class="mk mq" data-k="'+k+i+':'+qi+'">❓</button><div class="p">'+(q[2]?'觀念釐清：':'想一想：')+q[0]+'</div>'+(q[2]?'<div class="mc">'+q[2].o.map(function(o,oi){return '<button class="mo" data-i="'+oi+'"><b>'+'ABCDE'.charAt(oi)+'.</b> '+o+'</button>';}).join('')+'</div><div class="mcf" aria-live="polite"></div><details><summary>直接看正解</summary><div class="a">✅ 答：'+'ABCDE'.charAt(q[2].a)+'. '+q[2].o[q[2].a]+'<br><span class="ex">'+q[1]+'</span></div></details>':'<details><summary>看答案</summary><div class="a">'+q[1]+'</div></details>')+'</div>';});h+='</div>';}
    if(s.note)h+='<div class="note"><details><summary>👂 上課聽這裡</summary>'+s.note+'</details></div>';
    h+='</div></div></section>';
  });
});
el('slides').innerHTML=h;
Object.keys(DECKS).forEach(function(k){DECKS[k].SL.forEach(function(s){if(s.init)s.init();});});
if(Object.keys(DECKS).length<2)el('tabs').style.display='none';
el('tabs').innerHTML=Object.keys(DECKS).map(function(k){return '<button data-d="'+k+'">'+DECKS[k].name+'</button>';}).join('');
function curId(){return 's'+deck+cur;}
function go(d,i){
  deck=d;var SL=DECKS[d].SL;cur=Math.max(0,Math.min(SL.length-1,i));
  Object.keys(DECKS).forEach(function(k){DECKS[k].SL.forEach(function(s,n){el('s'+k+n).classList.toggle('cur',k===d&&n===cur);});});
  Array.prototype.forEach.call(el('tabs').children,function(b){b.classList.toggle('on',b.getAttribute('data-d')===d);});
  el('jump').innerHTML=SL.map(function(s,n){return '<option value="'+n+'">'+(pageMarked(d,n)?'❓ ':'')+(n+1)+'. '+s.t.replace(/<[^>]+>/g,'')+'</option>';}).join('');
  el('jump').value=String(cur);
  el('pb').style.width=((cur+1)/SL.length*100)+'%';
  el('prev').disabled=cur===0;
  el('next').textContent=cur===SL.length-1?'完成 ✓':'下一步 ▶';
  try{history.replaceState(null,'','#'+d+(cur+1));}catch(e){}
  window.scrollTo(0,0);
  if(INK.cv[curId()])canvasFor(curId());
}

/* ===== 手寫層 =====
   每一頁各自一張透明畫布，筆跡存成向量（換頁再回來還在，重新整理才會消失）。
   「只有筆能寫」：觸控筆（或滑鼠）寫字，手指照常捲動、按「看答案」。 */
var INK={on:false,color:'pu',erase:false,penOnly:true,strokes:{},cv:{}};
try{var pp=localStorage.getItem('handout_ink_pen_only');if(pp!==null)INK.penOnly=(pp==='1');}catch(e){}
/* 手寫顏色刻意避開圖形用的橘、綠、藍、磚紅、深灰 */
var INKC={pu:['#7b1fa2','#ce93d8'],pk:['#e91e63','#f48fb1'],cy:['#0097a7','#4dd0e1']};
function inkColor(c){var dk=false;try{dk=matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.getAttribute('data-theme')!=='light';}catch(e){}return (INKC[c]||INKC.pu)[dk?1:0];}
function canvasFor(id){
  var sec=el(id),cv=INK.cv[id];
  if(!cv){cv=document.createElement('canvas');cv.className='ink-cv';sec.appendChild(cv);INK.cv[id]=cv;}
  if(!INK.strokes[id])INK.strokes[id]=[];
  var w=sec.clientWidth,hh=sec.clientHeight,r=window.devicePixelRatio||1;
  if(w&&hh&&(cv._w!==w||cv._h!==hh||cv._r!==r)){cv._w=w;cv._h=hh;cv._r=r;cv.width=Math.round(w*r);cv.height=Math.round(hh*r);cv.style.width=w+'px';cv.style.height=hh+'px';redraw(id);}
  return cv;
}
function seg(ctx,s,a,b){ctx.strokeStyle=inkColor(s.c);ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
function redraw(id){
  var cv=INK.cv[id];if(!cv||!cv._w)return;var ctx=cv.getContext('2d'),r=cv._r||1;
  ctx.setTransform(r,0,0,r,0,0);ctx.clearRect(0,0,cv._w,cv._h);
  (INK.strokes[id]||[]).forEach(function(s){
    if(s.p.length===1){seg(ctx,s,s.p[0],[s.p[0][0]+0.1,s.p[0][1]]);return;}
    ctx.strokeStyle=inkColor(s.c);ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(s.p[0][0],s.p[0][1]);
    for(var k=1;k<s.p.length;k++)ctx.lineTo(s.p[k][0],s.p[k][1]);ctx.stroke();
  });
}
function eraseAt(x,y){
  function near(p,q){var vx=q[0]-p[0],vy=q[1]-p[1],L=vx*vx+vy*vy,t=L?Math.max(0,Math.min(1,((x-p[0])*vx+(y-p[1])*vy)/L)):0,dx=p[0]+t*vx-x,dy=p[1]+t*vy-y;return dx*dx+dy*dy<196;}
  var id=curId(),a=INK.strokes[id]||[],keep=a.filter(function(s){for(var k=0;k<s.p.length;k++)if(near(s.p[k],s.p[Math.min(k+1,s.p.length-1)]))return false;return true;});
  if(keep.length!==a.length){INK.strokes[id]=keep;redraw(id);}
}
var drawing=null,finger=null;
function pos(e){var rc=INK.cv[curId()].getBoundingClientRect();return [Math.round((e.clientX-rc.left)*10)/10,Math.round((e.clientY-rc.top)*10)/10];}
el('slides').addEventListener('pointerdown',function(e){
  if(!INK.on)return;
  var penLike=(e.pointerType==='pen'||e.pointerType==='mouse');
  if(!penLike&&INK.penOnly){finger={id:e.pointerId,y:e.clientY};return;}
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();var id=curId();canvasFor(id);
  var p=pos(e),er=INK.erase||(e.buttons&32)===32;
  drawing={id:e.pointerId,erase:er,sec:id};
  try{el('slides').setPointerCapture(e.pointerId);}catch(_){}
  if(er){eraseAt(p[0],p[1]);return;}
  drawing.s={c:INK.color,w:e.pointerType==='pen'?3:4,p:[p]};INK.strokes[id].push(drawing.s);redraw(id);
});
el('slides').addEventListener('pointermove',function(e){
  if(finger&&e.pointerId===finger.id){window.scrollBy(0,finger.y-e.clientY);finger.y=e.clientY;return;}
  if(!drawing||e.pointerId!==drawing.id)return;
  e.preventDefault();
  var evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e],ctx=INK.cv[drawing.sec].getContext('2d');
  evs.forEach(function(ev){
    var p=pos(ev);
    if(drawing.erase){eraseAt(p[0],p[1]);return;}
    var pts=drawing.s.p,last=pts[pts.length-1];
    if(Math.abs(p[0]-last[0])+Math.abs(p[1]-last[1])<1)return;
    pts.push(p);seg(ctx,drawing.s,last,p);
  });
});
function endInk(e){if(finger&&e.pointerId===finger.id)finger=null;if(drawing&&e.pointerId===drawing.id)drawing=null;}
el('slides').addEventListener('pointerup',endInk);
el('slides').addEventListener('pointercancel',endInk);
function setInk(on){
  INK.on=on;document.body.classList.toggle('ink',on);
  el('inkBtn').classList.toggle('inkon',on);el('inkBtn').setAttribute('aria-pressed',on?'true':'false');
  el('inkBtn').innerHTML=on?'✏️<span class="lb"> 手寫中</span>':'✏️<span class="lb"> 手寫</span>';
  if(on)canvasFor(curId());
}
function markTool(){
  el('inkbar').querySelectorAll('button[data-c]').forEach(function(b){b.classList.toggle('on',!INK.erase&&b.dataset.c===INK.color);});
  el('inkErase').classList.toggle('on',INK.erase);
}
el('inkBtn').onclick=function(){setInk(!INK.on);if(INK.on)setQP(false);};
el('inkbar').querySelectorAll('button[data-c]').forEach(function(b){b.onclick=function(){INK.color=b.dataset.c;INK.erase=false;markTool();};});
el('inkErase').onclick=function(){INK.erase=!INK.erase;markTool();};
el('inkUndo').onclick=function(){var id=curId(),a=INK.strokes[id];if(a&&a.length){a.pop();redraw(id);}};
el('inkClear').onclick=function(){var id=curId(),a=INK.strokes[id];if(a&&a.length&&confirm('清除這一頁的手寫？')){INK.strokes[id]=[];redraw(id);}};
el('inkSpace').onclick=function(){var sec=el(curId()),pb=parseInt(sec.style.paddingBottom||'18',10);sec.style.paddingBottom=(pb+320)+'px';canvasFor(curId());window.scrollBy(0,320);};
el('inkPen').checked=INK.penOnly;
el('inkPen').onchange=function(){INK.penOnly=el('inkPen').checked;try{localStorage.setItem('handout_ink_pen_only',INK.penOnly?'1':'0');}catch(e){}};
window.addEventListener('resize',function(){if(INK.cv[curId()])canvasFor(curId());});
el('slides').addEventListener('toggle',function(){if(INK.cv[curId()])canvasFor(curId());},true);

/* ===== ❓ 標記有問題的頁、題 =====
   點頁面上的「❓ 這頁有問題」或想一想右上角的「❓」標記；下方「❓ 問題」列出全部，點了直接跳過去。
   存在這台裝置的瀏覽器（localStorage），重新整理還在。 */
var QKEY='handout_marks_'+document.title;
try{QM=JSON.parse(localStorage.getItem(QKEY)||'{}')||{};}catch(e){QM={};}
function saveQM(){try{localStorage.setItem(QKEY,JSON.stringify(QM));}catch(e){}}
function plain(x){return String(x).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();}
function cut(x,n){return x.length>n?x.slice(0,n)+'…':x;}
function mkParse(k){return k.match(/^([A-Z])(\d+)(?::(\d+))?$/);}
function paintMarks(){
  el('slides').querySelectorAll('.mk').forEach(function(b){var on=!!QM[b.dataset.k];b.classList.toggle('on',on);if(!b.classList.contains('mq'))b.textContent=on?'❗ 已標記有問題':'❓ 這頁有問題';b.setAttribute('aria-pressed',on?'true':'false');});
  var n=Object.keys(QM).length;el('qpBtn').innerHTML='❓<span class="lb"> 問題</span>'+(n?'（'+n+'）':'');
  var SL=DECKS[deck].SL;Array.prototype.forEach.call(el('jump').options,function(o,i){o.textContent=(pageMarked(deck,i)?'❓ ':'')+(i+1)+'. '+plain(SL[i].t);});
  var multi=Object.keys(DECKS).length>1,keys=Object.keys(QM).filter(mkParse).sort(function(a,b){var pa=mkParse(a),pb=mkParse(b);if(pa[1]!==pb[1])return pa[1]<pb[1]?-1:1;return (+pa[2]-pb[2])||((pa[3]===undefined?-1:+pa[3])-(pb[3]===undefined?-1:+pb[3]));});
  var out='',lastPage='';
  keys.forEach(function(k){
    var m=mkParse(k);if(!DECKS[m[1]])return;var s=DECKS[m[1]].SL[+m[2]];if(!s)return;
    var head=(multi?DECKS[m[1]].name.split('｜')[0]+'　':'')+'第 '+(+m[2]+1)+' 頁　'+cut(plain(s.t),22);
    if(m[3]===undefined){out+='<a data-go="'+k+'">📄 '+head+'</a>';lastPage=m[1]+m[2];}
    else{var q=s.qs&&s.qs[+m[3]];if(!q)return;if(lastPage!==m[1]+m[2])out+='<a data-go="'+m[1]+m[2]+'">📄 '+head+'</a>';lastPage=m[1]+m[2];out+='<a class="sub" data-go="'+k+'">└ 想一想：'+cut(plain(q[0]),30)+'</a>';}
  });
  el('qpList').innerHTML=out||'<div class="empty">還沒有標記。看不懂的頁按標題旁的「❓ 這頁有問題」，看不懂的題目按想一想右上角的「❓」。</div>';
}
function setQP(on){document.body.classList.toggle('qp',on);el('qpBtn').classList.toggle('qon',on);if(on&&INK.on)setInk(false);}
el('slides').addEventListener('click',function(e){var b=e.target.closest('.mk');if(!b)return;e.preventDefault();var k=b.dataset.k;if(QM[k])delete QM[k];else QM[k]=1;saveQM();paintMarks();});
/* 選擇題：點選項 → 立刻顯示對錯；答錯的題自動標 ❓ */
el('slides').addEventListener('click',function(e){
  var b=e.target.closest('.mo');if(!b)return;
  var box=b.closest('.q'),m=box.id.match(/^q([A-Z])(\d+)_(\d+)$/);if(!m)return;
  var q=DECKS[m[1]].SL[+m[2]].qs[+m[3]],i=+b.dataset.i,mc=q[2],ok=(i===mc.a),f=box.querySelector('.mcf');
  Array.prototype.forEach.call(box.querySelectorAll('.mo'),function(x){x.classList.remove('ok','no');});
  b.classList.add(ok?'ok':'no');
  if(ok){f.className='mcf good';f.innerHTML='✅ 答對了！'+q[1];}
  else{f.className='mcf bad';f.innerHTML='❌ '+mc.w[i]+'<br><span class="try">再選選看，或按下面「直接看正解」。</span>';var k=m[1]+m[2]+':'+m[3];if(!QM[k]){QM[k]=1;saveQM();paintMarks();}}
});
el('qpBtn').onclick=function(){setQP(!document.body.classList.contains('qp'));};
el('qpClose').onclick=function(){setQP(false);};
el('qpClear').onclick=function(){if(Object.keys(QM).length&&confirm('清除全部的「有問題」標記？')){QM={};saveQM();paintMarks();}};
el('qpList').onclick=function(e){var a=e.target.closest('a[data-go]');if(!a)return;var m=mkParse(a.dataset.go);go(m[1],+m[2]);setQP(false);
  if(m[3]!==undefined){var q=el('q'+m[1]+m[2]+'_'+m[3]);if(q){q.scrollIntoView({block:'center'});q.classList.add('flash');setTimeout(function(){q.classList.remove('flash');},1600);}}};

el('tabs').onclick=function(e){var b=e.target.closest('button');if(b)go(b.getAttribute('data-d'),0);};
el('prev').onclick=function(){go(deck,cur-1);};
el('next').onclick=function(){if(cur<DECKS[deck].SL.length-1)go(deck,cur+1);};
el('jump').onchange=function(){go(deck,Number(el('jump').value));};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(deck,cur+1);else if(e.key==='ArrowLeft')go(deck,cur-1);});
var m=(location.hash||'').match(/^#([AB])(\d+)$/);
go(m?m[1]:'A',m?parseInt(m[2],10)-1:0);
paintMarks();
})();
</script>
</body>
</html>
