<script>
(function(){
/* ===== 圖形工具 ===== */
var UID=0,D2R=Math.PI/180;
function sn(i,k){var s=Math.sin(i*D2R)*k;return s>=1?null:Math.asin(s)/D2R;}
function f1(x){return (Math.round(x*10)/10).toString();}
function mk(id){
  var c=[['a','var(--ac)'],['b','var(--ac3)'],['c','var(--ac2)'],['d','var(--sub)'],['e','var(--bad)'],['k','currentColor']];
  return '<defs>'+c.map(function(m){return '<marker id="'+id+m[0]+'" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto-start-reverse"><path d="M0,1 L12,6.5 L0,12 Z" fill="'+m[1]+'"/></marker>';}).join('')+'</defs>';
}
function L(x1,y1,x2,y2,cls,id,m,both){
  return '<line class="'+cls+'" x1="'+f1(x1)+'" y1="'+f1(y1)+'" x2="'+f1(x2)+'" y2="'+f1(y2)+'"'+(m?' marker-end="url(#'+id+m+')"':'')+(both?' marker-start="url(#'+id+m+')"':'')+'/>';
}
function T(x,y,t,cls,anchor){return '<text class="'+(cls||'lbl')+'" x="'+f1(x)+'" y="'+f1(y)+'" text-anchor="'+(anchor||'start')+'">'+t+'</text>';}
function arc(cx,cy,ax,ay,bx,by,R,sweep,cls){
  return '<path class="'+cls+'" d="M'+f1(cx+ax*R)+' '+f1(cy+ay*R)+' A'+R+' '+R+' 0 0 '+sweep+' '+f1(cx+bx*R)+' '+f1(cy+by*R)+'"/>';
}
function eye(x,y){return '<ellipse cx="'+x+'" cy="'+y+'" rx="17" ry="10" fill="#fff" stroke="currentColor" stroke-width="2"/><circle cx="'+x+'" cy="'+y+'" r="5.5" fill="#333"/>';}

/* 折射示意圖：上介質 → 下介質，入射線一律從左上射入
   o: i入射角 r折射角 top bot(介質名稱) refl(畫反射線) names(畫線名) li lr lf(角度標籤) ai ar(與界面夾角)
      vert(垂直入射) pts(標A,O,B) both(雙向箭頭) */
function rayFig(o){
  var id='r'+(++UID),W=380,H=290,cx=190,cy=145,Ln=120,i=o.i,r=o.r;
  var si=Math.sin(i*D2R),ci=Math.cos(i*D2R),sr=Math.sin(r*D2R),cr=Math.cos(r*D2R),R=o.R||42;
  var s='<svg class="fig" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(o.aria||'光的折射示意圖')+'">'+mk(id);
  s+='<rect x="0" y="0" width="'+W+'" height="'+cy+'" fill="var(--soft)"/><rect x="0" y="'+cy+'" width="'+W+'" height="'+(H-cy)+'" fill="var(--ac3)" fill-opacity=".16"/>';
  s+=L(0,cy,W,cy,'ifc')+L(cx,12,cx,H-10,'nl');
  s+=T(10,24,o.top,'lbl2')+T(10,H-12,o.bot,'lbl2');
  s+=T(cx+6,24,'法線','lbl')+T(W-8,cy-7,'界面','lbl','end');
  if(o.vert){
    s+=L(cx-9,30,cx-9,cy,'rI',id,'a')+L(cx+9,cy,cx+9,30,'rF',id,'c')+L(cx,cy,cx,H-22,'rR',id,'b');
    s+=T(cx-16,62,'入射線','tI','end')+T(cx+17,62,'反射線','tF')+T(cx+8,H-30,'折射線','tR');
    return s+'</svg>';
  }
  var ix=cx-Ln*si,iy=cy-Ln*ci,rx=cx+Ln*sr,ry=cy+Ln*cr;
  s+=L(ix,iy,cx,cy,'rI',id,'a',o.both)+L(cx,cy,rx,ry,'rR',id,'b',o.both);
  if(o.refl)s+=L(cx,cy,cx+Ln*.78*si,cy-Ln*.78*ci,'rF',id,'c');
  s+=arc(cx,cy,0,-1,-si,-ci,R,0,'arcI')+arc(cx,cy,0,1,sr,cr,R,0,'arcR');
  if(o.refl)s+=arc(cx,cy,0,-1,si,-ci,R,1,'arcF');
  var ga=Math.min(i+24,84)*D2R,gb=Math.min(r+24,84)*D2R,RR=R+44;
  if(o.li){if(o.ai){var a=i/2*D2R;s+=T(cx-(R+16)*Math.sin(a)-4,cy-(R+16)*Math.cos(a)+4,o.li,'tI','start');}
    else s+=T(cx-RR*Math.sin(ga),cy-RR*Math.cos(ga)+4,o.li,'tI','end');}
  if(o.lr){if(o.ai)s+=T(cx-8,cy+R+24,o.lr,'tR','end');
    else s+=T(cx+RR*Math.sin(gb),cy+RR*Math.cos(gb)+8,o.lr,'tR');}
  if(o.refl&&o.lf)s+=T(cx+RR*Math.sin(ga)+2,cy-RR*Math.cos(ga)+4,o.lf,'tF');
  if(o.ai){var R2=R+30,vx=-1-si,vy=-ci,vl=Math.sqrt(vx*vx+vy*vy);
    s+=arc(cx,cy,-1,0,-si,-ci,R2,1,'arcX')+T(cx+vx/vl*(R2+16),cy+vy/vl*(R2+16)+5,o.ai,'lbl2','middle');}
  if(o.ar){var R3=R+30,ux=1+sr,uy=cr,ul=Math.sqrt(ux*ux+uy*uy);
    s+=arc(cx,cy,1,0,sr,cr,R3,1,'arcX')+T(cx+ux/ul*(R3+16),cy+uy/ul*(R3+16)+5,o.ar,'lbl2','middle');}
  if(o.names){
    s+=T(ix+6,iy-6,'入射線','tI')+T(rx+4,Math.min(ry+16,H-4),'折射線','tR','start');
    if(o.refl)s+=T(cx+Ln*.78*si+6,cy-Ln*.78*ci-4,'反射線','tF');
  }
  if(o.pts){s+=T(ix-4,iy+2,'A','tI','end')+T(cx-12,cy-8,'O','lbl2','end')+T(rx+8,ry+4,'B','tR');}
  return s+'</svg>';
}

/* 全反射：光源 P 在水中，入射角 20°、40°、臨界角、60° */
function tirFig(){
  var id='t'+(++UID),W=440,H=275,y0=120,Px=36,Py=225,dep=Py-y0,s='<svg class="fig" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="全反射示意圖">'+mk(id);
  s+='<rect x="0" y="0" width="'+W+'" height="'+y0+'" fill="var(--soft)"/><rect x="0" y="'+y0+'" width="'+W+'" height="'+(H-y0)+'" fill="var(--ac3)" fill-opacity=".16"/>'+L(0,y0,W,y0,'ifc');
  s+=T(10,22,'空氣（光速快）','lbl2')+T(W-10,H-10,'水（光速慢）','lbl2','end');
  var th=[20,40,48.8,66],nm=['①','②','③','④'],hx;
  s+='<circle cx="'+Px+'" cy="'+Py+'" r="6" fill="var(--ac)"/>'+T(Px+10,Py+20,'光源 P','lbl2');
  th.forEach(function(a,k){
    hx=Px+dep*Math.tan(a*D2R);
    s+=L(Px,Py,hx,y0,'rI');
    if(k===0||k===1){var r=Math.asin(Math.min(.9999,Math.sin(a*D2R)*1.333))/D2R,ex=hx+85*Math.sin(r*D2R),ey=y0-85*Math.cos(r*D2R);

/* ===== 主題二圖形工具 ===== */
/* 向量折射：d 入射方向(單位)，n 指向入射側的法線(單位)，eta=n1/n2 */
function refr(d,n,eta){var ci=-(d[0]*n[0]+d[1]*n[1]),k=1-eta*eta*(1-ci*ci);if(k<0)return null;var a=eta*ci-Math.sqrt(k);return [eta*d[0]+a*n[0],eta*d[1]+a*n[1]];}
function hitSeg(p,d,a,b){var ex=b[0]-a[0],ey=b[1]-a[1],den=d[0]*ey-d[1]*ex;if(Math.abs(den)<1e-9)return null;var t=((a[0]-p[0])*ey-(a[1]-p[1])*ex)/den,u=((a[0]-p[0])*d[1]-(a[1]-p[1])*d[0])/den;return (t>1e-6&&u>=-1e-9&&u<=1+1e-9)?t:null;}
function edgeN(a,b,d){var ex=b[0]-a[0],ey=b[1]-a[1],l=Math.sqrt(ex*ex+ey*ey),n=[ey/l,-ex/l];if(n[0]*d[0]+n[1]*d[1]>0)n=[-n[0],-n[1]];return n;}
function nearest(tri,p,d,skip){var best=null;for(var k=0;k<3;k++){if(k===skip)continue;var t=hitSeg(p,d,tri[k],tri[(k+1)%3]);if(t!==null&&(!best||t<best.t))best={t:t,k:k};}return best;}
function norm(v){var l=Math.sqrt(v[0]*v[0]+v[1]*v[1]);return [v[0]/l,v[1]/l];}
/* 光線穿過三角形玻璃（折射率 n）：回傳入射點、出射點、兩面法線、出射方向 */
function traceTri(tri,p,d,n){
  var h1=nearest(tri,p,d,-1);if(!h1)return null;
  var e1=[p[0]+d[0]*h1.t,p[1]+d[1]*h1.t],n1=edgeN(tri[h1.k],tri[(h1.k+1)%3],d),d2=refr(d,n1,1/n);
  var h2=nearest(tri,e1,d2,h1.k);if(!h2)return null;
  var e2=[e1[0]+d2[0]*h2.t,e1[1]+d2[1]*h2.t],n2=edgeN(tri[h2.k],tri[(h2.k+1)%3],d2),d3=refr(d2,n2,n);
  return {e1:e1,e2:e2,n1:n1,n2:n2,d3:d3};
}
function poly(pts){return '<polygon points="'+pts.map(function(q){return f1(q[0])+','+f1(q[1]);}).join(' ')+'" fill="var(--ac3)" fill-opacity=".22" stroke="currentColor" stroke-width="2"/>';}
function clipTo(x0,y0,dx,dy,W,H){var t=1e9;if(dx>1e-9)t=Math.min(t,(W-6-x0)/dx);if(dx<-1e-9)t=Math.min(t,(6-x0)/dx);if(dy>1e-9)t=Math.min(t,(H-6-y0)/dy);if(dy<-1e-9)t=Math.min(t,(6-y0)/dy);return [x0+dx*t,y0+dy*t];}

  s+=L(e1[0],e1[1],e1[0]+d[0]*330,e1[1]+d[1]*330,'ghostL');
  s+=L(p0[0],p0[1],e1[0],e1[1],'rI')+L(e1[0],e1[1],e2[0],e2[1],'rI')+L(e2[0],e2[1],e2[0]+d3[0]*120,e2[1]+d3[1]*120,'rI',id,'a');
  s+=T(W-6,24,'虛線＝原本的方向','lbl','end')+T(W-6,H-12,'出來後往下偏（往球心那邊）','tI','end');
  s+=T(10,y0-12,'空氣','lbl2');
  return s+'</svg>';
}

function tbl(head,rows){
  var h='<table class="t"><tr>'+head.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr>';
  rows.forEach(function(r){h+='<tr>'+r.map(function(x){return '<td>'+x+'</td>';}).join('')+'</tr>';});
  return h+'</table>';
}

 text:'<b>臨界角</b>：折射角剛好變成 <b>90°</b>（光貼著界面走）時的「入射角」。水→空氣的臨界角約 <b>48.8°</b>。'+tbl(['入射角','發生什麼事'],[['小於 48.8°','有折射（光進入空氣），也有一點反射'],['等於 48.8°（臨界角）','折射角 90°，光貼著界面走，沒有光進入空氣'],['大於 48.8°','不再折射，光<b>全部反射</b>回水裡 ＝ <b>全反射</b>']])+AI+'<b>發生全反射的兩個條件</b>（從講義內容整理）：① 光從光速<b>慢</b>的介質進入光速<b>快</b>的介質　② 入射角 ≥ 臨界角。',

 sheet:'講義 p.180「全反射」：入射角增加至臨界角（48.8 度）時，折射角為 90 度；大於等於臨界角時，便不再發生折射，稱為全反射。',

A({t:'全反射的應用',src:'講義 p.180；自修 p.169（海市蜃樓）',

A({t:'折射的生活實例 (1)：看起來變淺',tag:'生活實例',src:'講義 p.181、自修 p.169（圖2、第 4 點）',

A({t:'生活實例 (2)：斷掉的筷子、浮起的硬幣、彩虹',tag:'生活實例',src:'講義 p.181、自修 p.169（動腦時間）',
 text:'<b>筷子「斷」了</b>：水中那一段每個點都看起來變淺（往上抬），所以在水面處看起來斷成兩截。<br><br><b>硬幣浮起來（課本動腦時間）</b>：碗底的硬幣被碗邊擋住，只看到邊緣。慢慢加水後，硬幣反射的光在水與空氣的界面<b>折射</b>（偏離法線），轉進眼睛，就看到整個硬幣，好像<b>浮起來</b>了。<br><br><b>彩虹</b>：陽光照到半空中的水滴，光線被折射及反射，在天空形成拱形的七彩光譜。',

A({t:'哪些現象是「折射」？',tag:'分類練習',src:'講義 p.185 隨堂演練 22 第 5 題；自修 p.177 第 1 題',

A({t:'生活實例 (3)：從水裡看岸上、人看魚',tag:'生活實例',src:'講義 p.181 圖、p.182 類題 1',
 text:tbl(['誰看誰','光線怎麼走','看起來'],[['人看水中的魚','水→空氣，偏離法線','魚比實際<b>淺</b>、離人較<b>近</b>'],['魚看空氣中的人／鳥','空氣→水，偏向法線','人、鳥比實際<b>高</b>、離魚較<b>遠</b>']])+AI+'記法：<b>「看水裡的東西 → 變淺／變近；從水裡往外看 → 變高／變遠」</b>。',

A({t:'練習：鳥和魚',tag:'練習',src:'講義 p.182 精選範例 1；講義 p.186 隨堂演練 22 第 13 題',

A({t:'畫光線路徑 (1)：平行玻璃',tag:'作圖',src:'講義 p.181（描繪折射路徑）、p.183 精選範例 3',

A({t:'畫光線路徑 (2)：半圓玻璃 ① 垂直射入平面',tag:'作圖',src:'講義 p.181；自修 p.181 第 9 題',

A({t:'畫光線路徑 (2)：半圓玻璃 ② 射向圓心 O',tag:'作圖',src:'講義 p.181、p.183 類題 1（93 基測）',

A({t:'畫光線路徑 (3)：圓形水滴',tag:'作圖',src:'講義 p.183 類題 2；自修 p.181 第 7 題（95 基測）',

A({t:'📌補充：進入新介質，什麼變、什麼不變？',tag:'📌 補充',src:'講義 p.182 精選範例 2、p.186 隨堂演練 22 第 7 題（題目有，教材沒有解釋）',

A({t:'小結：這一部分你應該帶走的',tag:'完成',

B({t:'三稜鏡：光往「厚」的地方彎',src:'講義 p.187（B. 三稜鏡）、自修 p.170',
 fig:prismFig(),
 text:'光穿過三稜鏡，一共<b>折射 2 次</b>（主題一學過）：<ol><li>空氣 → 玻璃（快→慢）：偏<b>向</b>法線</li><li>玻璃 → 空氣（慢→快）：偏<b>離</b>法線</li></ol>兩次轉彎加起來，光都往三稜鏡的<b>底部（厚度大的地方）</b>偏折。',
 sheet:'講義 p.187「B. 三稜鏡」：光線從空氣射入三稜鏡，又由三稜鏡射出到空氣時，經過【<b>2</b>】次折射，因而改變了方向 → <b>向厚偏</b>。',
 qs:[['光從空氣進入三稜鏡，會往三稜鏡的哪裡偏折？','往厚度大的部分（底部）偏折。（課本觀念掃描 4）']],
 note:AI+'講義圖右邊畫了一隻眼睛：光往底部偏，眼睛順著光往回看，物體反而像是往「尖端」那邊跑。這是依講義的圖推論的，上課可以留意老師怎麼說。'});

B({t:'兩個三稜鏡組合 ①：底對底',src:'講義 p.187、自修 p.170',
 fig:prismCombo('conv'),
 text:'上一頁學到：光通過三稜鏡，會往<b>厚</b>的地方（底部）偏折。<br>把兩個三稜鏡<b>底對底</b>放在一起，厚的部分在中間：上面那個讓光往下彎、下面那個讓光往上彎 → 光都往中間<b>會聚</b> → 功能像<b>凸透鏡</b>。<br>'+AI+'透鏡就像很多個小三稜鏡疊在一起。',
 sheet:'講義 p.187「2. 三稜鏡的組合」：會聚光線的組合 → <b>凸透鏡</b>；發散光線的組合 → <b>凹透鏡</b>。'});

B({t:'兩個三稜鏡組合 ②：尖對尖',src:'講義 p.187、自修 p.170',
 fig:prismCombo('div'),
 text:'兩個三稜鏡<b>尖對尖</b>放在一起，薄的部分在中間、厚的在外側：上面那個讓光往上彎、下面那個讓光往下彎 → 光往外<b>發散</b> → 功能像<b>凹透鏡</b>。',
 qs:[['「兩個三稜鏡不論怎麼組合，都只會發散光線」對嗎？','不對。底對底的組合會讓光會聚。（課本觀念掃描 4、自修 p.178 第 12 題）']]});

B({t:'透鏡的種類',src:'講義 p.187（C. 透鏡成像 1. 透鏡）、自修 p.171',
 fig:lensTypes(),
 text:tbl(['','凸透鏡','凹透鏡'],[['構造','中央<b>較厚</b>','中央<b>較薄</b>'],['功能','<b>會聚</b>光線（會聚透鏡）','<b>發散</b>光線（發散透鏡）'],['應用','放大鏡、相機、望遠鏡、遠視眼鏡','近視眼鏡']])+AI+'<b>名字小技巧：看最後一個字。</b>「凹凸透鏡」最後是「凸」→ 凸透鏡；「凸凹透鏡」最後是「凹」→ 凹透鏡。真正的判斷標準還是「中間厚還是薄」。',
 sheet:'講義 p.187 表格：構造（中央較厚／中央較薄）、分類（雙凸、平凸、凹凸／雙凹、平凹、凸凹）、特性（會聚光線／發散光線）、應用。',
 qs:[['「凹凸透鏡」是凸透鏡還是凹透鏡？','凸透鏡。它中間比邊緣厚。（隨堂演練 23 第 1 題考看外形挑凸透鏡）'],['把一片平凸透鏡翻面，平行光射進去，還會會聚嗎？','會。翻面後中間還是比邊緣厚，還是凸透鏡。（講義 p.193 類題 2）']]});

B({t:'先認識名詞：鏡心、主軸、焦點、焦距',tag:'名詞先搞懂',src:'自修 p.171（透鏡的各部分名稱）',
 fig:lensFig({type:'convex',inf:true,names:true,flen:true,W:380,H:255,ay:115,lx:170,no2F:true,note:'凸透鏡：真的光會聚 → 實焦點'}),
 text:'<ul><li><b>鏡心</b>：透鏡的正中心。</li><li><b>主軸</b>：通過鏡心、和透鏡垂直的那條直線。</li><li><b>焦點（F）</b>：平行主軸的光經過<b>凸透鏡</b>後，真的聚在一點 → <b>實焦點</b>。</li><li><b>焦距</b>：焦點到透鏡中心的距離（圖下方標出的那一段）。透鏡<b>兩側各有一個焦點，焦距相等</b>。</li></ul>凹透鏡的焦點不一樣，下一頁看。',
 note:'講義直接用「焦點」「鏡前焦點」，沒有先解釋，這頁和下一頁是用課本 p.171 補上的。'});

B({t:'凹透鏡的焦點：虛焦點',tag:'名詞先搞懂',src:'自修 p.171（透鏡的各部分名稱）',
 fig:lensFig({type:'concave',inf:true,flen:true,W:380,H:255,ay:115,lx:210,no2F:true,note:'凹透鏡：延長線交會 → 虛焦點'}),
 text:'平行主軸的光經過<b>凹透鏡</b>後會<b>散開</b>，實際的光不會交在一起。<br>把散開的光<b>往回延長</b>（虛線），延長線會交在透鏡前面的一點 → 這一點叫<b>虛焦點</b>。<br>虛焦點到透鏡中心的距離，也叫<b>焦距</b>（圖下方標出的那一段）。',
 qs:[['凹透鏡的焦點是實焦點還是虛焦點？為什麼？','虛焦點。光並沒有真的聚在那裡，是散開的光「往回延長」才交在一起。']]});

B({t:'再認識：鏡前、鏡後、2F、物距、像距',tag:'名詞先搞懂',src:'講義 p.187～189 的用詞；自修 p.174（物距、像距）',
 fig:lensFig({type:'convex',d:150,rays:[],sides:true,dist:true,H:250,ay:140,aria:'鏡前鏡後與物距'}),
 text:'<ul><li><b>鏡前</b>：物體放的那一側。<b>鏡後</b>：另一側。（講義的「鏡前焦點」「鏡後焦點」就是指這兩邊的 F）</li><li><b>2F</b>：兩倍焦距的位置。焦距 10 公分，2F 就在 20 公分處。</li><li><b>物距</b>：物體到鏡心的距離。<b>像距</b>：像到鏡心的距離。</li></ul>',
 qs:[['焦距 15 公分的凸透鏡，2F 在離鏡心幾公分的地方？','30 公分。（15 × 2 ＝ 30）']],
 note:AI+'「鏡前、鏡後」的說明是依講義用詞整理的。之後所有成像規則都用「物體在 F 內、F 和 2F 之間、2F 外」來分，一定要先會看 F 和 2F。'});

B({t:'實像和虛像',tag:'名詞先搞懂',src:'自修 p.172（透鏡成像 1.）、p.173（註）',
 text:tbl(['','實像','虛像'],[['怎麼形成','<b>實際光線</b>會聚而成','光線的<b>延長線</b>交會而成'],['紙屏接得到嗎','<b>可以</b>（眼睛也看得到）','<b>不行</b>，只能用眼睛透過鏡子看'],['透鏡成像時','一定是<b>倒立</b>','一定是<b>正立</b>'],['例子','電影銀幕上的畫面','平面鏡裡的你、放大鏡下的字']])+eq('透鏡：倒立 ＝ 實像；正立 ＝ 虛像'),
 qs:[['用紙屏接不到，只能用眼睛透過透鏡看到的像，是實像還是虛像？','虛像。'],['透鏡成的像如果是倒立的，一定是什麼像？','實像。'],['平面鏡的虛像在哪一邊？透鏡的虛像在哪一邊？','平面鏡：在鏡子<b>後面</b>（和物體不同側）。透鏡：在<b>鏡前</b>（和物體同側）。所以「虛像必與物體在同側」只對透鏡成立，面鏡不成立。（隨堂演練 23 第 5 題的陷阱）']],
 note:'課本 p.173 的註：「透鏡所成的像，若為倒立均為實像；若為正立均為虛像。」可以直接背。表格裡的「例子」欄是補充的。'});

B({t:'虛像怎麼在眼睛裡成像？',tag:'💡 補充說明',src:'原理見自修 p.185（眼睛的水晶體相當於凸透鏡、視網膜上成實像）；這張圖講義和課本都沒有，是依透鏡公式畫的',
 fig:eyeVirtualFig(),
 text:AI+'虛像那個位置<b>其實沒有光</b>，眼睛怎麼看得到？光走了兩段路：<ol><li><b>放大鏡</b>：物體在焦距內，光折射後<b>散開</b>，沒有交在一起（所以紙屏接不到）。但散開的方向，剛好<b>像是從虛像那一點射出來</b>的（虛線）。</li><li><b>眼睛</b>：散開的光進入眼睛，<b>水晶體也是凸透鏡</b>，把散開的光<b>再會聚一次</b>，真的聚在視網膜上 → 視網膜上是<b>倒立縮小的實像</b>。</li></ol>大腦不知道光中途被放大鏡折過，只會把光<b>往回直直推</b>，所以覺得東西在虛像的位置、而且變大了。<br>對眼睛來說，虛像就像一個真的放在那裡的物體。',
 qs:[['為什麼紙屏接不到虛像，眼睛卻看得到？','紙屏只接得到「真的聚在一起」的光；散開的光打在紙屏上只是一片模糊的亮光。眼睛多了水晶體，能把散開的光再聚起來。'],['用放大鏡看到的是虛像，那落在視網膜上的是實像還是虛像？','實像。不管看的是實物、實像還是虛像，視網膜上的像一定是光真的聚成的實像。（4-4 隨堂演練 24 第 11 題的陷阱）']],
 note:'眼睛的構造在 4-4 光學儀器會詳細學，這裡先知道「水晶體是凸透鏡、視網膜上是實像」就好。'});

B({t:'光其實折射了兩次（透鏡很薄，作圖時簡化）',tag:'💡 補充說明',src:'講義和課本都沒有這張圖，是依折射定律算出來畫的；原理同講義 p.187 三稜鏡',
 fig:thickLensFig(),
 text:AI+'光穿過凸透鏡，和三稜鏡一樣，真的折射了<b>兩次</b>：<ol><li><b>進入透鏡</b>：光從空氣（快）進入玻璃（慢），在左邊鏡面<b>偏向</b>法線。</li><li><b>離開透鏡</b>：光從玻璃（慢）進入空氣（快），在右邊鏡面<b>偏離</b>法線。</li></ol>兩次都往透鏡中間（比較厚的地方）彎，所以光會聚到焦點 F。<br><br><b>為什麼作圖只彎一次？</b>透鏡很薄，兩次折射的位置非常靠近，所以課本和講義作圖時，就當成光在透鏡<b>中間那條虛線</b>一次轉完，只看光進去前和出來後的方向。考試作圖也這樣畫。<br><br><b>下一頁的三條作圖規則也一樣</b>：「平行主軸 → 通過焦點」「通過焦點 → 平行主軸」「通過鏡心 → 不偏折」都是<b>薄透鏡的理想情況</b>。真實的透鏡會有非常小的偏差，但小到畫圖看不出來，<b>考試一律當成完全正確</b>。',
 qs:[['畫透鏡作圖題時，要畫出兩次折射嗎？','不用。在透鏡中間的虛線轉彎一次就好。'],['為什麼凸透鏡能讓平行光會聚？','光經過兩次折射，兩次都往透鏡比較厚的中間偏折，和三稜鏡是同一個道理。']]});

B({t:'凸透鏡的三條作圖線',tag:'重點',src:'講義 p.188（3. 凸透鏡 (1)）、自修 p.182（智慧櫥窗）',
 fig:lensFig({type:'convex',d:150,num:true,aria:'凸透鏡三條作圖線'}),
 text:'從物體頂端畫光線，記住三條「特別的光」：<ol><li><b>平行主軸</b>的光 → 折射後<b>通過鏡後焦點</b></li><li><b>通過鏡前焦點</b>的光 → 折射後<b>平行主軸</b></li><li><b>通過鏡心</b>的光 → <b>不偏折</b>，直直走</li></ol>三條線交在一起的地方，就是<b>像</b>（紅色箭頭）。其實只要畫<b>兩條</b>就找得到交點（課本智慧櫥窗：任兩條折射光線的交點即為成像的位置）。',
 sheet:'講義 p.188「(1) 凸透鏡作圖法則」：① 平行主軸 → 過鏡後焦點　② 過鏡前焦點 → 平行主軸　③ 過鏡心 → 不偏折',
 qs:[['①和②有什麼關係？','剛好相反（光的可逆性）：平行進去會過焦點；過焦點進去會平行出來。'],['某張作圖裡，通過鏡心的光線出來後轉彎了。這張圖對嗎？','不對。通過鏡心的光不偏折。（講義 p.193 精選範例 9 就是要你挑出不符合這三條規則的圖）']],
 note:'這三條是畫所有凸透鏡圖的基本功。上課看老師畫圖時，對照是哪兩條線。'});

B({t:'凸透鏡成像 ①：物體在很遠的地方',tag:'凸透鏡 6 種位置',src:'講義 p.189（無窮遠）、自修 p.173',
 fig:lensFig({type:'convex',inf:true,note:'很遠的光 ≈ 平行光 → 聚在鏡後焦點'}),
 text:'物體很遠很遠（例如太陽），射來的光幾乎是<b>平行光</b>。<br>→ 光經過透鏡<b>折射</b>後，會聚在<b>鏡後焦點</b>，成一個<b>很小的亮點</b>。',
 sheet:'講義 p.189 第 1 列「無窮遠」：(1) 成像於鏡後焦點　(2) 只有一點　(3) 縮小　(4) 實像',
 qs:[['用凸透鏡讓太陽光聚成最小、最亮的點，紙或火柴會燒起來。這個點在哪裡？','鏡後焦點。這也是找焦點的方法。（講義 p.191 類題 1 的火柴就是這個原理）']]});

B({t:'凸透鏡成像 ②：物體在 2F 外',tag:'凸透鏡 6 種位置',src:'講義 p.189（2F 外）、自修 p.172',
 fig:lensFig({type:'convex',d:150}),
 text:'物體在兩倍焦距<b>外面</b>（離透鏡很遠）：'+eq('倒立、縮小、實像')+'像在<b>鏡後 F 和 2F 之間</b>。<br>光經過透鏡<b>折射</b>後，實際的光線<b>真的交在</b>鏡後一點 → 這就是<b>實像</b>（紙屏接得到）。',
 sheet:'講義 p.189「2F 外」：(1) 成像於鏡後 F～2F　(2) 倒立　(3) 縮小　(4) 實像',
 qs:[['這時候像比物體大還是小？','小（縮小）。'],['照相機要把遠方的大風景拍進小小的感光元件，是哪種情況？',AI+'2F 外 → 倒立縮小實像。（這是 4-4 光學儀器的內容，先預告）']]});

B({t:'凸透鏡成像 ③：物體在 2F 上',tag:'凸透鏡 6 種位置',src:'講義 p.189（2F）、自修 p.172',
 fig:lensFig({type:'convex',d:120}),
 text:'物體剛好在兩倍焦距上：'+eq('倒立、等大、實像')+'像也在<b>鏡後 2F 上</b>，像和物體一樣大，物距 ＝ 像距。<br>光經過透鏡<b>折射</b>後，實際的光線<b>真的交在</b>鏡後一點 → 這就是<b>實像</b>（紙屏接得到）。',
 sheet:'講義 p.189「2F」：(1) 成像於鏡後 2F　(2) 倒立　(3) 相等　(4) 實像',
 qs:[['實驗時發現「物距 ＝ 像距 ＝ 30 公分」，焦距是多少？','物體在 2F 上，2F ＝ 30 公分，所以焦距 ＝ 30 ÷ 2 ＝ 15 公分。']],
 note:'「等大」這一格最常被拿來算焦距：物距 ＝ 像距時，那個距離 ÷ 2 就是焦距（講義 p.194 範例 10、p.195 類題 1 都用到）。'});

B({t:'凸透鏡成像 ④：物體在 F 和 2F 之間',tag:'凸透鏡 6 種位置',src:'講義 p.189（F～2F）、自修 p.172',

 sheet:'講義 p.189「F～2F」：(1) 成像於鏡 2F 外　(2) 倒立　(3) 放大　(4) 實像',

B({t:'凸透鏡成像 ⑤：物體在 F 上',tag:'凸透鏡 6 種位置',src:'講義 p.189（F）、自修 p.175（討論 2）',

B({t:'凸透鏡成像 ⑥：物體在 F 內',tag:'凸透鏡 6 種位置',src:'講義 p.189（F 內）、自修 p.172',

B({t:'凸透鏡成像統整（講義填空表）',tag:'超重要',src:'講義 p.190（(3) 凸透鏡成像統整）、自修 p.173（透鏡成像性質表）',
 text:tbl(['物體位置','像的位置','正倒','大小','虛實'],[['無窮遠（平行光）','鏡後 F','—','一點','實'],['2F 外','鏡後 F～2F','倒立','縮小','實'],['2F 上','鏡後 2F 上','倒立','等大','實'],['F～2F','鏡後 2F 外','倒立','放大','實'],['F 上','不成像','—','—','—'],['F 內','鏡前','正立','放大','虛']])+'<b>六種情況光都有折射</b>，差別在折射後的光怎麼走：'+tbl(['物體位置','折射後的光','結果'],[['F 外','真的<b>交在一起</b>','實像（倒立）'],['F 上','互相<b>平行</b>，永遠不交','不成像'],['F 內','<b>散開</b>，往回延長才交在一起','虛像（正立）']])+AI+'<b>口訣</b>（坊間常用，講義和課本沒有）：<ul><li><b>「一倍焦距分虛實」</b>：F 外是實像（倒立），F 內是虛像（正立）</li><li><b>「二倍焦距分大小」</b>：2F 外縮小、2F 上等大、2F 內放大</li></ul>',
 sheet:'講義 p.190「(3) 凸透鏡成像統整」的空格（像的位置、正倒、大小、虛實），就填上面這些。',
 qs:[['物體在 F～2F 之間：正立還倒立？放大還縮小？實像還虛像？','F 外 → 實像、倒立；在 2F 內 → 放大。答：倒立放大實像。'],['物體在 3F 處呢？','F 外 → 倒立實像；2F 外 → 縮小。答：倒立縮小實像。']],
 note:'這張表很常考。先用兩句口訣推，推不出來再背表。'});

B({t:'兩種「放大」：實像和虛像的應用',tag:'整理',src:'講義 p.198 隨堂演練 23 第 12 題；自修 p.186（老師說）、p.189（智慧櫥窗）；4-4 講義 p.201、p.206～207',
 text:'凸透鏡有兩種位置會「放大」，一個是實像、一個是虛像：'+tbl(['','F～2F：倒立放大實像','F 內：正立放大虛像'],[['怎麼看到','像投射在<b>屏幕上</b>，大家都看得到','只能<b>透過透鏡</b>用眼睛看'],['應用','<b>電影放映機</b><br><b>單槍投影機</b>、幻燈機<br>顯微鏡的<b>物鏡</b>（4-4）','<b>放大鏡</b><br>顯微鏡的<b>目鏡</b>（4-4）<br>望遠鏡的目鏡<br>老花眼鏡（透過鏡片看到眼睛變大）']])+AI+'<b>好記的分法</b>：要讓<b>一群人</b>看放大的畫面 → 投到銀幕上 → 實像 → F～2F；要讓<b>自己一個人</b>湊近看細節 → 虛像 → F 內。<br><br><b>顯微鏡兩種都用到</b>：物鏡先在 F～2F 成倒立放大實像，目鏡再把這個實像放在 F 內，成放大虛像（4-4 會學）。',
 qs:[['電影放映機的影片要正著放還是倒著放？為什麼？','倒著放。影片在 F～2F，成的是倒立的像，倒著放，銀幕上才會是正的。'],['用凸透鏡看郵票，看到正立放大的像；改成把燈光經過凸透鏡投到牆上，看到放大的像。這兩個像各是什麼像？','看郵票：郵票在 F 內 → 正立放大虛像。投到牆上：在 F～2F → 倒立放大實像。']],
 note:'顯微鏡、望遠鏡、老花眼鏡在 4-4 光學儀器會詳細學，這裡先知道它們是用哪一種放大。'});

 text:'凸透鏡，物體在焦距<b>外</b>，往右移（靠近透鏡）：<ul><li>實像也往<b>右</b>移，而且離透鏡<b>越來越遠</b></li><li>實像<b>越來越大</b>（圖中從 0.5 倍變成 2 倍）</li></ul>課本寫「物體向透鏡靠近，則像遠離透鏡且漸變大」。'+AI+'簡單記：'+eq('物近 → 像遠 → 像變大'),

B({t:'物體移動 ②：焦距內，像也往右，但變小',tag:'重點',src:'講義 p.190（②）',
 fig:moveFig({type:'convex',f:80,d1:60,d2:40,h:30,W:520,H:275,ay:165,lx:400,hh:66,yA:214,yB:244,tA:'物體往右',tB:'虛像往右（靠近透鏡）',aria:'焦距內物體往右移，虛像往右移且變小'}),
 text:'凸透鏡，物體在焦距<b>內</b>，往右移（靠近透鏡）：<ul><li>虛像也往<b>右</b>移，<b>靠近透鏡</b></li><li>虛像<b>越來越小</b>（圖中從 4 倍變成 2 倍），但一直都<b>比物體大</b></li></ul>'+AI+'所以「物近像遠像變大」<b>不能</b>用在這裡。這裡是：'+eq('物近 → 像近 → 像變小（仍比物大）')+AI+'用放大鏡想：放大鏡貼著書，字幾乎沒放大；慢慢拿高，字越來越大。反過來，放大鏡越靠近書，字越小。',
 sheet:'講義 p.190：② 物體由凸透鏡焦點內移近鏡心，像由鏡前接近透鏡，形成的虛像漸【<b>變小</b>】，但仍【<b>比物體大</b>】。',

B({t:'物體移動 ③：凹透鏡，像也往右，而且變大',tag:'重點',src:'講義 p.188（凹透鏡 ①②）',
 fig:moveFig({type:'concave',f:60,d1:180,d2:60,h:80,W:520,H:275,ay:130,lx:330,hh:84,yA:222,yB:250,tA:'物體往右',tB:'虛像往右',aria:'凹透鏡物體往右移，虛像往右移且變大'}),
 text:'凹透鏡，物體往右移（靠近透鏡）：<ul><li>虛像也往<b>右</b>移，<b>靠近透鏡</b>（移動的距離很小）</li><li>虛像<b>越來越大</b>（圖中從 0.25 倍變成 0.5 倍），但一直都<b>比物體小</b></li></ul>'+AI+'簡單記：'+eq('物近 → 像近 → 像變大（仍比物小）'),
 sheet:'講義 p.188：① 物向右移，像向【<b>右</b>】移　② 物體由凹透鏡前遠處移近透鏡，像由鏡前焦點接近鏡心，形成的虛像漸【<b>變大</b>】，但仍【<b>比物體小</b>】。',
 qs:[['燭火慢慢移向凹透鏡，像會越來越大，有可能比燭火還大嗎？','不可能。越來越大，但永遠比物體小。（講義 p.192 範例 8(3)）']]});

B({t:'物體移動：三種情況總整理',tag:'超重要',src:'講義 p.188、p.190 的內容，整理成一張表',
 text:AI+'把前三頁放在一起比較（物體都是往右、靠近透鏡）：'+tbl(['情況','像往哪移','離透鏡','像的大小'],[['凸透鏡，焦距外（實像）','往右','越來越<b>遠</b>','<b>變大</b>'],['凸透鏡，焦距內（虛像）','往右','越來越<b>近</b>','<b>變小</b>，但仍比物大'],['凹透鏡（虛像）','往右','越來越<b>近</b>','<b>變大</b>，但仍比物小']])+'<ul><li><b>共同點</b>：物體往右移，像也往右移（講義：不管凸或凹透鏡）。</li><li><b>不同點</b>：像的大小怎麼變，三種情況都不一樣，要分開記。</li><li><b>例外</b>：物體<b>跨過焦點</b>的那一刻，像會從鏡後很遠的地方，突然跳到鏡前很遠的地方。題目通常在同一區裡移動，所以不用擔心。</li></ul>',
 qs:[['「物近像遠像變大」適用於哪一種情況？','只適用凸透鏡、焦距外（實像）。'],['下一頁的互動頁，可以怎麼驗證這張表？','勾選「留下移動前的位置」，再分別在焦距外、焦距內、凹透鏡拉動物體，看淡色和深色的像怎麼移。']],
 note:'下一頁可以自己拖拉驗證。'});

B({t:'動手玩：拖拉物體，看像怎麼變',tag:'💡 互動',src:'自己做的互動頁，依公式 1/焦距 ＝ 1/物距 ＋ 1/像距 計算',
 text:'<div id="simFig"></div><div style="margin:6px 0"><label><input type="radio" name="simT" value="convex" checked> 凸透鏡</label>　<label><input type="radio" name="simT" value="concave"> 凹透鏡</label></div><div>物距：<b id="simDv"></b><br><input type="range" id="simD" min="3" max="40" value="18" style="width:100%"><br><span class="src">← 往左拉：物體離透鏡越遠　｜　往右拉：物體越靠近透鏡 →</span></div><div style="margin:4px 0"><label><input type="checkbox" id="simG" checked> 留下移動前的位置（淡色）</label></div><div id="simOut" class="q"></div>',
 init:function(){
   var F=50,base=null;
   function ghost(v,tp){
     var d=v/10*F,cv=tp==='convex',lx=250,ay=150,h=40,g='<g opacity=".35">';
     g+='<line class="obj" x1="'+(lx-d)+'" y1="'+ay+'" x2="'+(lx-d)+'" y2="'+(ay-h)+'"/>';
     if(!(cv&&v===10)){var di=cv?d*F/(d-F):-d*F/(d+F),xi=lx+di,yi=ay+h*di/d;
       if(xi>8&&xi<472&&yi>8&&yi<292)g+='<line class="'+(di>0?'img':'imgd')+'" x1="'+xi+'" y1="'+ay+'" x2="'+xi+'" y2="'+yi+'"/>';}
     return g+'</g>';
   }
   function draw(){
     var v=43-Number(document.getElementById('simD').value),tp=document.querySelector('input[name=simT]:checked').value,d=v/10*F,cv=tp==='convex';
     document.getElementById('simDv').textContent=(v/10).toFixed(1)+' 倍焦距';
     var fig=lensFig({type:tp,d:d,f:F,W:480,H:300,ay:150,lx:250,h:40,hh:118,aria:'可拖拉的透鏡成像'});
     if(base&&document.getElementById('simG').checked&&base[1]===tp&&base[0]!==v)fig=fig.replace('</svg>',ghost(base[0],tp)+'</svg>');
     document.getElementById('simFig').innerHTML=fig;
     var out;
     if(!cv){var di=d*F/(d+F);out='像在<b>鏡前 F 內</b>，像距約 '+(di/F).toFixed(1)+' 倍焦距<br>性質：<b>正立、縮小、虛像</b>（放大率約 '+(di/d).toFixed(2)+' 倍）';}
     else if(v===10)out='物體在 F 上：光線平行，<b>不成像</b>';
     else{var di2=d*F/(d-F),m=Math.abs(di2/d),pos,pr;
       if(v<10){pos='鏡前（和物體同側）';pr='正立、放大、虛像';}
       else if(v<20){pos='鏡後 2F 外';pr='倒立、放大、實像';}
       else if(v===20){pos='鏡後 2F 上';pr='倒立、等大、實像';}
       else{pos='鏡後 F～2F';pr='倒立、縮小、實像';}
       out='像在<b>'+pos+'</b>，像距約 '+Math.abs(di2/F).toFixed(1)+' 倍焦距'+(Math.abs(di2)>230?'（太遠，畫面外）':'')+'<br>性質：<b>'+pr+'</b>（放大率約 '+m.toFixed(2)+' 倍）';}
     document.getElementById('simOut').innerHTML=out;
   }
   var sl=document.getElementById('simD');
   function mark(){base=[43-Number(sl.value),document.querySelector('input[name=simT]:checked').value];}
   sl.oninput=draw;sl.addEventListener('pointerdown',mark);sl.addEventListener('touchstart',mark,{passive:true});sl.addEventListener('keydown',function(){if(!base)mark();});
   document.getElementById('simG').onchange=draw;
   Array.prototype.forEach.call(document.querySelectorAll('input[name=simT]'),function(r){r.onchange=function(){base=null;draw();};});
   draw();
 },
 qs:[['試試看：凸透鏡，把物體從 4 倍焦距慢慢拉到 1.1 倍焦距，像怎麼變？','像越來越遠、越來越大（物近像遠像變大）。2 倍焦距時剛好等大。'],['換成凹透鏡，不管物體放哪裡，像有什麼共同點？','永遠是正立、縮小、虛像，而且在鏡前 F 內。']],
 note:'這頁的像是用公式算出來的。拉到剛好 1.0 倍和 2.0 倍焦距時，注意看會發生什麼事。'});

B({t:'用透鏡看字：判斷是哪種透鏡、焦距多長',tag:'常考題型',src:'講義 p.191 精選範例 5、6 和類題 1；p.197 隨堂演練 23 第 2、3 題；p.198 第 10 題；自修 p.178 第 13 題',
 text:RE+'用透鏡直接看東西（不用紙屏），看到的像只有兩種可能：<ul><li><b>正立放大</b> → 凸透鏡，而且物體在 <b>F 內</b>（物距 &lt; 焦距）</li><li><b>正立縮小</b> → 凹透鏡（任何距離都一樣）</li></ul>凸透鏡<b>做不出正立縮小</b>的像；凹透鏡<b>做不出放大</b>的像。',
 qs:[['透鏡放在課本上方 4 公分，看到的字<b>正立放大</b>。這是什麼透鏡？焦距大於還是小於 4 公分？','凸透鏡。字在 F 內，所以 4 &lt; 焦距，焦距<b>大於</b> 4 公分。'],['透鏡放在課本上方 4 公分，看到的字<b>正立縮小</b>。這是什麼透鏡？','凹透鏡。凹透鏡不管放多遠都是正立縮小，所以無法從這裡判斷焦距。'],['爺爺把放大鏡拿在成績單上方 8 公分，看到字正立放大。放大鏡焦距可能是 6 公分還是 12 公分？','12 公分。正立放大要物距 &lt; 焦距，8 &lt; 12。'],['用凸透鏡貼著直尺，慢慢拿遠，看到的刻度怎麼變？','一開始（F 內）正立放大，越拿越遠字越大；拿到超過焦距之後，會看到倒立的像。'],['用凸透鏡看一隻昆蟲，看到正立放大的像，昆蟲在哪裡？','在焦點和鏡心之間（F 內）。']],
 note:'這類題目不給紙屏，只問「看到什麼」。先判斷正立放大還是正立縮小，就知道是凸還是凹。'});

B({t:'怎麼找凸透鏡的焦點？方法 a',src:'講義 p.190（③ 尋找焦點的方法）、自修 p.174（實驗幫手）',
 fig:lensFig({type:'convex',inf:true,W:380,H:220,ay:110,lx:150,no2F:true,note:'(a) 平行光 → 聚成最小最亮的點'}),
 text:'<b>方法 a</b>：讓太陽光（平行光）通過凸透鏡，在白紙上聚成<b>最小、最亮的點</b> → 那裡就是<b>鏡後焦點</b>，量這個點到鏡面的距離就是焦距。',
 sheet:'講義 p.190「③ 尋找焦點的方法」：a. 太陽光通過凸透鏡後，成一亮點的位置即是鏡後焦點',
 qs:[['「蠟燭放在透鏡左邊，右邊用紙屏找到燭火最清楚的位置，那裡就是焦點」對嗎？','不對！那是「像」的位置，不一定是焦點。（講義 p.194 範例 10 的陷阱選項）']]});

B({t:'怎麼找凸透鏡的焦點？方法 b',src:'講義 p.190（③ 尋找焦點的方法）',

B({t:'凹透鏡的三條作圖線',tag:'重點',src:'講義 p.187（2. 凹透鏡 (1)）、自修 p.182（智慧櫥窗）',

B({t:'凹透鏡成像：永遠正立縮小虛像',tag:'重點',src:'講義 p.188（(2)(3) 凹透鏡作圖、成像統整）、自修 p.173',

B({t:'動手玩：凹透鏡，拖拉物體看像怎麼變',tag:'💡 互動',src:'自己做的互動頁，依公式 1/焦距 ＝ 1/物距 ＋ 1/像距 計算',
 text:'<div id="ccFig"></div><div>物距：<b id="ccDv"></b><br><input type="range" id="ccD" min="3" max="38" value="10" style="width:100%"><br><span class="src">← 往左拉：物體離透鏡越遠　｜　往右拉：物體越靠近透鏡 →</span></div><div style="margin:4px 0"><label><input type="checkbox" id="ccG" checked> 留下移動前的位置（淡色）</label></div><div id="ccOut" class="q"></div>',
 init:function(){
   var F=80,lx=400,ay=150,h=70,base=null,sl=document.getElementById('ccD');
   function val(){return 43-Number(sl.value);}
   function ghost(v){
     var d=v/10*F,di=d*F/(d+F),xi=lx-di,yi=ay-h*di/d,g='<g opacity=".35">';
     g+='<line class="obj" x1="'+(lx-d)+'" y1="'+ay+'" x2="'+(lx-d)+'" y2="'+(ay-h)+'"/>';
     g+='<line class="imgd" x1="'+xi+'" y1="'+ay+'" x2="'+xi+'" y2="'+yi+'"/>';
     return g+'</g>';
   }
   function draw(){
     var v=val(),d=v/10*F,di=d*F/(d+F),m=di/d;
     document.getElementById('ccDv').textContent=(v/10).toFixed(1)+' 倍焦距';
     var fig=lensFig({type:'concave',d:d,f:F,W:560,H:280,ay:ay,lx:lx,h:h,hh:110,aria:'可拖拉的凹透鏡成像'});
     if(base!==null&&document.getElementById('ccG').checked&&base!==v)fig=fig.replace('</svg>',ghost(base)+'</svg>');
     document.getElementById('ccFig').innerHTML=fig;
     document.getElementById('ccOut').innerHTML='像在<b>鏡前 F 內</b>，像距約 '+(di/F).toFixed(2)+' 倍焦距<br>性質：<b>正立、縮小、虛像</b>（放大率約 '+m.toFixed(2)+' 倍）';
   }
   function mark(){base=val();}
   sl.oninput=draw;sl.addEventListener('pointerdown',mark);sl.addEventListener('touchstart',mark,{passive:true});sl.addEventListener('keydown',function(){if(base===null)mark();});
   document.getElementById('ccG').onchange=draw;
   draw();
 },
 qs:[['把物體從 4 倍焦距慢慢拉到很靠近透鏡，虛像怎麼變？','虛像一直在鏡前 F 內，往右靠近透鏡，而且越來越大；但放大率永遠小於 1，比物體小。'],['不管物體放哪裡，凹透鏡的像有什麼共同點？','永遠是正立、縮小、虛像，而且在鏡前焦點以內。']],
 note:'和前面凸透鏡的拖拉頁比較：凸透鏡跨過焦點，像會從實像變成虛像；凹透鏡怎麼拉都不會變。'});

B({t:'凸透鏡 vs 凹透鏡 總整理',src:'自修 p.173（透鏡成像性質表）',
 text:tbl(['透鏡','物體位置','像的位置','像的性質'],[['凸','無窮遠','鏡後 F','一點'],['凸','2F 外','鏡後 F～2F','倒立縮小實像'],['凸','2F 上','鏡後 2F','倒立等大實像'],['凸','F～2F','鏡後 2F 外','倒立放大實像'],['凸','F 上','—','不成像'],['凸','F 內','鏡前','正立放大虛像'],['凹','任何位置','鏡前 F 內','正立縮小虛像']])+AI+'<b>一眼記：</b>凸透鏡什麼都能變（放大、等大、縮小、實、虛）；凹透鏡只有「正立縮小虛像」。',

B({t:'課本實驗：透鏡的成像觀察',tag:'實驗',src:'自修 p.174～175（實驗 4·3）',
 fig:benchFig(),
 text:'<b>目的</b>：改變光源、透鏡、紙屏的相對位置，探討透鏡的成像性質。<br><b>預測</b>：凸透鏡會使平行光會聚、凹透鏡會使平行光發散 → 凸透鏡可能呈現實像、虛像；凹透鏡可能呈現虛像。<br><b>器材</b>：光具座、已知焦距的凸透鏡和凹透鏡、光源（蠟燭）、紙屏。<br><b>步驟</b>：<ol><li>先找焦距：讓太陽光通過凸透鏡，在白紙上聚成最小最亮的點，量點到鏡面的距離。</li><li>把凸透鏡固定在光源和紙屏中間。</li><li>光源從 2 倍焦距外，一步步靠近透鏡；每次前後移動紙屏，直到像<b>最清楚</b>。</li><li>記錄像的大小、方向，比較物距、像距和焦距的關係。紙屏接不到時，從紙屏那一端透過透鏡看。</li><li>換成凹透鏡，觀察光源在焦距外和焦距內的成像。</li></ol>',
 qs:[['為什麼可以用太陽光當平行光？','太陽離地球非常遠，射來的光可以看成平行光。（課本實驗幫手）'],['用蠟燭當光源要注意什麼？','小心燭火，注意安全。（課本老師說）']]});

B({t:'實驗結果與討論',tag:'實驗',src:'自修 p.175～176（實驗結果、結果與討論、進一步探索）',
 text:'<b>凸透鏡</b>（課本用焦距 15 公分）：'+tbl(['物距和焦距比較','像距和焦距比較','成像性質'],[['大於 2f','介於 f～2f','倒立縮小實像'],['等於 2f','等於 2f','倒立等大實像'],['介於 f～2f','大於 2f','倒立放大實像'],['等於 f','無法成像','無法成像'],['小於 f','紙屏上接不到','正立放大虛像']])+'<b>凹透鏡</b>：紙屏上都接不到，透過透鏡看到<b>正立縮小虛像</b>。',
 qs:[['討論 1：紙屏上無法成像代表什麼？透過透鏡看到的是什麼像？','光線沒有會聚到紙屏上；透過透鏡看到的是虛像。'],['討論 2：光源剛好在焦點上，能看到像嗎？為什麼？','不能。光的可逆性：從焦點發出的光，經透鏡折射後平行射出，所以無法成像。'],['討論 3：凸透鏡、凹透鏡各能成哪些像？','凸透鏡：放大、等大、縮小的倒立實像，以及正立放大虛像。凹透鏡：只有正立縮小虛像。'],['進一步探索：生活中有什麼東西可以代替凸透鏡？','透明玻璃珠、圓柱形玻璃杯裝水、表面光滑的透明寶特瓶裝水。']]});

B({t:'練習：從實驗數據找焦距',tag:'練習',src:'講義 p.194 精選範例 10；p.199 隨堂演練 23 第 7 題；自修 p.181 第 10 題',
 text:RE+'用凸透鏡做實驗，物距和像距如下（單位：公分）：'+tbl(['物距','15','18','24','36','48','很遠'],[['像距','60','36','24','18','16','？']]),
 qs:[['(1) 透鏡的焦距是多少？','找「物距 ＝ 像距」：24 ＝ 24，那就是 2F。焦距 ＝ 24 ÷ 2 ＝ 12 公分。'],['(2) 表中的「？」是多少？','物體很遠 → 像在鏡後焦點 → 12 公分。'],['(3) 物距 30 公分，紙屏上成什麼像？','30 &gt; 2F（24）→ 倒立縮小實像。'],['(4) 物距 20 公分呢？','12 &lt; 20 &lt; 24 → F～2F → 倒立放大實像。'],['(5) 物距小於多少公分時，紙屏上就接不到像？','小於或等於焦距 12 公分（F 上不成像、F 內是虛像）。'],['(6) 成實像時，物距越大，像距越大還是越小？','越小（物遠像近）。所以「物距愈大，像距也愈大」是錯的。']],

B({t:'練習：實驗題怎麼移動？',tag:'練習',src:'自修 p.176 實驗題 1、2；講義 p.198 隨堂演練 23 第 4 題、p.199 第 13（107 會考）、14 題（109 會考）',

B({t:'練習：從像的樣子反推焦距',tag:'練習',src:'講義 p.200 隨堂演練 23 第 15 題（100 基測）；p.195 類題 1(3)',

B({t:'📌進階：玻璃裡的「空氣透鏡」',tag:'📌 進階',src:'講義 p.195 精選範例 11 與類題 1',
 text:AI+'「光往厚的地方彎」有個前提：透鏡材料的光速要比外面<b>慢</b>（例如玻璃在空氣中）。<br><br>如果在一大塊玻璃中間，挖出一個凸透鏡形狀的<b>空氣</b>（空氣比玻璃快），情況就<b>反過來</b>：光反而往外散 → 效果像<b>凹透鏡</b>，看到縮小的像。<br><br>同理：玻璃中有一個凸透鏡形的<b>水泡</b>（水比玻璃快）→ 也會<b>發散</b>光線。',
 qs:[['厚玻璃中挖出一塊凸透鏡形狀的空心，從側面看物體會怎樣？','相當於凹透鏡，有縮小的效果。']],
 note:'屬於進階題。先記住結論：透鏡「裡面比外面快」→ 效果相反。'});

B({t:'📌進階：兩個透鏡組合、凹透鏡加水',tag:'📌 進階',src:'講義 p.193 類題 1；p.200 隨堂演練 23 第 16 題（102 基測）；自修 p.180 第 4 題',
 text:AI+'這兩種題目都只用到前面學過的規則，下面是推理過程：<br><br><b>① 兩個透鏡共用一個焦點</b>：平行光射進第一個凸透鏡 → 聚到焦點 F → 光穿過 F 後繼續散開 → 如果第二個凸透鏡的焦點也在 F，對它來說光就是「從焦點出發」→ 出來又變成<b>平行光</b>。凹透鏡＋凸透鏡也一樣：平行光經凹透鏡散開，好像從凹透鏡的鏡前焦點發出；若凸透鏡的焦點也在這一點，出來就是平行光。<br><br><b>② 凹透鏡下方的容器加水</b>：雷射光經凹透鏡散開，斜斜射到容器底。加滿水後，光從空氣斜射入水（快→慢），偏<b>向</b>法線，變得更「直」，所以底部兩個光點會<b>靠近一點</b>；但光在水面以上已經散開了，所以還是比原本兩道光的間距大。',
 qs:[[RE+'兩道相距 4 公分的平行雷射光，經凹透鏡後照到空容器底，兩光點相距 12 公分。容器加滿水後，兩光點距離 X 是？','4 &lt; X &lt; 12。加水後光偏向法線、光點靠近，但不會比原本的 4 公分還近。']],
 note:'這兩題是講義和課本的進階題，看不懂可以先跳過，上課聽老師怎麼講。'});

B({t:'小試身手',tag:'檢查自己',src:'自己出的題目，題型來自講義隨堂演練 23 和自修學力測驗',

B({t:'小結：這一部分你應該帶走的',tag:'完成',
 text:'<ol><li>三稜鏡：折射 2 次，光往<b>厚</b>的地方偏；底對底會聚（像凸透鏡）、尖對尖發散（像凹透鏡）。</li><li>凸透鏡中間厚、會聚；凹透鏡中間薄、發散。</li><li>名詞：鏡心、主軸、焦點（凸實、凹虛）、焦距、鏡前／鏡後、物距／像距。</li><li>凸透鏡三條線：平行→過焦點、過焦點→平行、過鏡心不偏折。</li><li>口訣：<b>一倍焦距分虛實，二倍焦距分大小</b>；<b>物近像遠像變大</b>。</li><li>透鏡：<b>倒立＝實像，正立＝虛像</b>。凹透鏡永遠正立縮小虛像。</li><li>物距＝像距 → 那是 2F，焦距＝÷2。</li><li>直接看：正立放大 → 凸透鏡且在 F 內；正立縮小 → 凹透鏡。</li><li>遮一半透鏡：像完整、只變暗。</li></ol><b>上課前的小任務：</b>老師畫凸透鏡六種位置的圖時，對照預習的圖，看他畫的是哪兩條線。',
 note:'兩個主題都預習完了。上課抄筆記時，遇到熟悉的表格就放心抄，把注意力留給老師講的「為什麼」。'});

/* ===== 主題二從這裡接續 B({...}) ===== */

/* ===== 播放 ===== */
var deck='A',cur=0,QM={};
function pageMarked(d,n){var p=d+n;for(var k in QM)if(k===p||k.indexOf(p+':')===0)return true;return false;}
function el(i){return document.getElementById(i);}
var h='';
Object.keys(DECKS).forEach(function(k){
  DECKS[k].SL.forEach(function(s,i){
    h+='<section class="slide" id="s'+k+i+'"><span class="tag'+(s.tag&&/^(📌|💡)/.test(s.tag)?' sup':'')+'">'+(s.tag||('步驟 '+(i+1)))+'</span><h1>'+s.t+'</h1><button class="mk" data-k="'+k+i+'">❓ 這頁有問題</button>'+(s.src?'<div class="src">📖 出處：'+s.src+'</div>':'');
    /* 橫放平板：有圖的頁圖在左、文字在右；沒圖但有文字＋想一想：文字在左、想一想在右（見 CSS .sbody.two） */
    var tq=!s.fig&&s.qs&&s.text;
    h+='<div class="sbody'+(s.fig?' two':(tq?' two tq':''))+'">';
    if(s.fig)h+='<div class="sfig">'+s.fig+'</div>';
    else if(tq)h+='<div class="sfig"><div class="txt">'+s.text+'</div>'+(s.sheet?'<div class="sheet">✍️ <b>對照講義</b>：'+s.sheet+'</div>':'')+'</div>';
    h+='<div class="stxt">';
    if(s.text&&!tq)h+='<div class="txt">'+s.text+'</div>';
    if(s.sheet&&!tq)h+='<div class="sheet">✍️ <b>對照講義</b>：'+s.sheet+'</div>';
    if(s.qs){h+='<div class="qs'+(s.qs.length>2&&!s.fig&&!tq?' qgrid':'')+'">';s.qs.forEach(function(q,qi){h+='<div class="q" id="q'+k+i+'_'+qi+'"><button class="mk mq" data-k="'+k+i+':'+qi+'">❓</button><div class="p">想一想：'+q[0]+'</div><details><summary>看答案</summary><div class="a">'+q[1]+'</div></details></div>';});h+='</div>';}
    if(s.note)h+='<div class="note"><details><summary>👂 上課聽這裡</summary>'+s.note+'</details></div>';
    h+='</div></div></section>';
  });
});
el('slides').innerHTML=h;
Object.keys(DECKS).forEach(function(k){DECKS[k].SL.forEach(function(s){if(s.init)s.init();});});
if(Object.keys(DECKS).length<2)el('tabs').style.display='none';
el('tabs').innerHTML=Object.keys(DECKS).map(function(k){return '<button data-d="'+k+'">'+DECKS[k].name+'</button>';}).join('');
function curId(){return 's'+deck+cur;}
function go(d,i){
  deck=d;var SL=DECKS[d].SL;cur=Math.max(0,Math.min(SL.length-1,i));
  Object.keys(DECKS).forEach(function(k){DECKS[k].SL.forEach(function(s,n){el('s'+k+n).classList.toggle('cur',k===d&&n===cur);});});
  Array.prototype.forEach.call(el('tabs').children,function(b){b.classList.toggle('on',b.getAttribute('data-d')===d);});
  el('jump').innerHTML=SL.map(function(s,n){return '<option value="'+n+'">'+(pageMarked(d,n)?'❓ ':'')+(n+1)+'. '+s.t.replace(/<[^>]+>/g,'')+'</option>';}).join('');
  el('jump').value=String(cur);
  el('pb').style.width=((cur+1)/SL.length*100)+'%';
  el('prev').disabled=cur===0;
  el('next').textContent=cur===SL.length-1?'完成 ✓':'下一步 ▶';
  try{history.replaceState(null,'','#'+d+(cur+1));}catch(e){}
  window.scrollTo(0,0);
  if(INK.cv[curId()])canvasFor(curId());
}

/* ===== 手寫層 =====
   每一頁各自一張透明畫布，筆跡存成向量（換頁再回來還在，重新整理才會消失）。
   「只有筆能寫」：觸控筆（或滑鼠）寫字，手指照常捲動、按「看答案」。 */
var INK={on:false,color:'pu',erase:false,penOnly:true,strokes:{},cv:{}};
try{var pp=localStorage.getItem('handout_ink_pen_only');if(pp!==null)INK.penOnly=(pp==='1');}catch(e){}
/* 手寫顏色刻意避開圖形用的橘、綠、藍、磚紅、深灰 */
var INKC={pu:['#7b1fa2','#ce93d8'],pk:['#e91e63','#f48fb1'],cy:['#0097a7','#4dd0e1']};
function inkColor(c){var dk=false;try{dk=matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.getAttribute('data-theme')!=='light';}catch(e){}return (INKC[c]||INKC.pu)[dk?1:0];}
function canvasFor(id){
  var sec=el(id),cv=INK.cv[id];
  if(!cv){cv=document.createElement('canvas');cv.className='ink-cv';sec.appendChild(cv);INK.cv[id]=cv;}
  if(!INK.strokes[id])INK.strokes[id]=[];
  var w=sec.clientWidth,hh=sec.clientHeight,r=window.devicePixelRatio||1;
  if(w&&hh&&(cv._w!==w||cv._h!==hh||cv._r!==r)){cv._w=w;cv._h=hh;cv._r=r;cv.width=Math.round(w*r);cv.height=Math.round(hh*r);cv.style.width=w+'px';cv.style.height=hh+'px';redraw(id);}
  return cv;
}
function seg(ctx,s,a,b){ctx.strokeStyle=inkColor(s.c);ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
function redraw(id){
  var cv=INK.cv[id];if(!cv||!cv._w)return;var ctx=cv.getContext('2d'),r=cv._r||1;
  ctx.setTransform(r,0,0,r,0,0);ctx.clearRect(0,0,cv._w,cv._h);
  (INK.strokes[id]||[]).forEach(function(s){
    if(s.p.length===1){seg(ctx,s,s.p[0],[s.p[0][0]+0.1,s.p[0][1]]);return;}
    ctx.strokeStyle=inkColor(s.c);ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(s.p[0][0],s.p[0][1]);
    for(var k=1;k<s.p.length;k++)ctx.lineTo(s.p[k][0],s.p[k][1]);ctx.stroke();
  });
}
function eraseAt(x,y){
  function near(p,q){var vx=q[0]-p[0],vy=q[1]-p[1],L=vx*vx+vy*vy,t=L?Math.max(0,Math.min(1,((x-p[0])*vx+(y-p[1])*vy)/L)):0,dx=p[0]+t*vx-x,dy=p[1]+t*vy-y;return dx*dx+dy*dy<196;}
  var id=curId(),a=INK.strokes[id]||[],keep=a.filter(function(s){for(var k=0;k<s.p.length;k++)if(near(s.p[k],s.p[Math.min(k+1,s.p.length-1)]))return false;return true;});
  if(keep.length!==a.length){INK.strokes[id]=keep;redraw(id);}
}
var drawing=null,finger=null;
function pos(e){var rc=INK.cv[curId()].getBoundingClientRect();return [Math.round((e.clientX-rc.left)*10)/10,Math.round((e.clientY-rc.top)*10)/10];}
el('slides').addEventListener('pointerdown',function(e){
  if(!INK.on)return;
  var penLike=(e.pointerType==='pen'||e.pointerType==='mouse');
  if(!penLike&&INK.penOnly){finger={id:e.pointerId,y:e.clientY};return;}
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();var id=curId();canvasFor(id);
  var p=pos(e),er=INK.erase||(e.buttons&32)===32;
  drawing={id:e.pointerId,erase:er,sec:id};
  try{el('slides').setPointerCapture(e.pointerId);}catch(_){}
  if(er){eraseAt(p[0],p[1]);return;}
  drawing.s={c:INK.color,w:e.pointerType==='pen'?3:4,p:[p]};INK.strokes[id].push(drawing.s);redraw(id);
});
el('slides').addEventListener('pointermove',function(e){
  if(finger&&e.pointerId===finger.id){window.scrollBy(0,finger.y-e.clientY);finger.y=e.clientY;return;}
  if(!drawing||e.pointerId!==drawing.id)return;
  e.preventDefault();
  var evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e],ctx=INK.cv[drawing.sec].getContext('2d');
  evs.forEach(function(ev){
    var p=pos(ev);
    if(drawing.erase){eraseAt(p[0],p[1]);return;}
    var pts=drawing.s.p,last=pts[pts.length-1];
    if(Math.abs(p[0]-last[0])+Math.abs(p[1]-last[1])<1)return;
    pts.push(p);seg(ctx,drawing.s,last,p);
  });
});
function endInk(e){if(finger&&e.pointerId===finger.id)finger=null;if(drawing&&e.pointerId===drawing.id)drawing=null;}
el('slides').addEventListener('pointerup',endInk);
el('slides').addEventListener('pointercancel',endInk);
function setInk(on){
  INK.on=on;document.body.classList.toggle('ink',on);
  el('inkBtn').classList.toggle('inkon',on);el('inkBtn').setAttribute('aria-pressed',on?'true':'false');
  el('inkBtn').innerHTML=on?'✏️<span class="lb"> 手寫中</span>':'✏️<span class="lb"> 手寫</span>';
  if(on)canvasFor(curId());
}
function markTool(){
  el('inkbar').querySelectorAll('button[data-c]').forEach(function(b){b.classList.toggle('on',!INK.erase&&b.dataset.c===INK.color);});
  el('inkErase').classList.toggle('on',INK.erase);
}
el('inkBtn').onclick=function(){setInk(!INK.on);if(INK.on)setQP(false);};
el('inkbar').querySelectorAll('button[data-c]').forEach(function(b){b.onclick=function(){INK.color=b.dataset.c;INK.erase=false;markTool();};});
el('inkErase').onclick=function(){INK.erase=!INK.erase;markTool();};
el('inkUndo').onclick=function(){var id=curId(),a=INK.strokes[id];if(a&&a.length){a.pop();redraw(id);}};
el('inkClear').onclick=function(){var id=curId(),a=INK.strokes[id];if(a&&a.length&&confirm('清除這一頁的手寫？')){INK.strokes[id]=[];redraw(id);}};
el('inkSpace').onclick=function(){var sec=el(curId()),pb=parseInt(sec.style.paddingBottom||'18',10);sec.style.paddingBottom=(pb+320)+'px';canvasFor(curId());window.scrollBy(0,320);};
el('inkPen').checked=INK.penOnly;
el('inkPen').onchange=function(){INK.penOnly=el('inkPen').checked;try{localStorage.setItem('handout_ink_pen_only',INK.penOnly?'1':'0');}catch(e){}};
window.addEventListener('resize',function(){if(INK.cv[curId()])canvasFor(curId());});
el('slides').addEventListener('toggle',function(){if(INK.cv[curId()])canvasFor(curId());},true);

/* ===== ❓ 標記有問題的頁、題 =====
   點頁面上的「❓ 這頁有問題」或想一想右上角的「❓」標記；下方「❓ 問題」列出全部，點了直接跳過去。
   存在這台裝置的瀏覽器（localStorage），重新整理還在。 */
var QKEY='handout_marks_'+document.title;
try{QM=JSON.parse(localStorage.getItem(QKEY)||'{}')||{};}catch(e){QM={};}
function saveQM(){try{localStorage.setItem(QKEY,JSON.stringify(QM));}catch(e){}}
function plain(x){return String(x).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();}
function cut(x,n){return x.length>n?x.slice(0,n)+'…':x;}
function mkParse(k){return k.match(/^([A-Z])(\d+)(?::(\d+))?$/);}
function paintMarks(){
  el('slides').querySelectorAll('.mk').forEach(function(b){var on=!!QM[b.dataset.k];b.classList.toggle('on',on);if(!b.classList.contains('mq'))b.textContent=on?'❗ 已標記有問題':'❓ 這頁有問題';b.setAttribute('aria-pressed',on?'true':'false');});
  var n=Object.keys(QM).length;el('qpBtn').innerHTML='❓<span class="lb"> 問題</span>'+(n?'（'+n+'）':'');
  var SL=DECKS[deck].SL;Array.prototype.forEach.call(el('jump').options,function(o,i){o.textContent=(pageMarked(deck,i)?'❓ ':'')+(i+1)+'. '+plain(SL[i].t);});
  var multi=Object.keys(DECKS).length>1,keys=Object.keys(QM).filter(mkParse).sort(function(a,b){var pa=mkParse(a),pb=mkParse(b);if(pa[1]!==pb[1])return pa[1]<pb[1]?-1:1;return (+pa[2]-pb[2])||((pa[3]===undefined?-1:+pa[3])-(pb[3]===undefined?-1:+pb[3]));});
  var out='',lastPage='';
  keys.forEach(function(k){
    var m=mkParse(k);if(!DECKS[m[1]])return;var s=DECKS[m[1]].SL[+m[2]];if(!s)return;
    var head=(multi?DECKS[m[1]].name.split('｜')[0]+'　':'')+'第 '+(+m[2]+1)+' 頁　'+cut(plain(s.t),22);
    if(m[3]===undefined){out+='<a data-go="'+k+'">📄 '+head+'</a>';lastPage=m[1]+m[2];}
    else{var q=s.qs&&s.qs[+m[3]];if(!q)return;if(lastPage!==m[1]+m[2])out+='<a data-go="'+m[1]+m[2]+'">📄 '+head+'</a>';lastPage=m[1]+m[2];out+='<a class="sub" data-go="'+k+'">└ 想一想：'+cut(plain(q[0]),30)+'</a>';}
  });
  el('qpList').innerHTML=out||'<div class="empty">還沒有標記。看不懂的頁按標題旁的「❓ 這頁有問題」，看不懂的題目按想一想右上角的「❓」。</div>';
}
function setQP(on){document.body.classList.toggle('qp',on);el('qpBtn').classList.toggle('qon',on);if(on&&INK.on)setInk(false);}
el('slides').addEventListener('click',function(e){var b=e.target.closest('.mk');if(!b)return;e.preventDefault();var k=b.dataset.k;if(QM[k])delete QM[k];else QM[k]=1;saveQM();paintMarks();});
el('qpBtn').onclick=function(){setQP(!document.body.classList.contains('qp'));};
el('qpClose').onclick=function(){setQP(false);};
el('qpClear').onclick=function(){if(Object.keys(QM).length&&confirm('清除全部的「有問題」標記？')){QM={};saveQM();paintMarks();}};
el('qpList').onclick=function(e){var a=e.target.closest('a[data-go]');if(!a)return;var m=mkParse(a.dataset.go);go(m[1],+m[2]);setQP(false);
  if(m[3]!==undefined){var q=el('q'+m[1]+m[2]+'_'+m[3]);if(q){q.scrollIntoView({block:'center'});q.classList.add('flash');setTimeout(function(){q.classList.remove('flash');},1600);}}};

el('tabs').onclick=function(e){var b=e.target.closest('button');if(b)go(b.getAttribute('data-d'),0);};
el('prev').onclick=function(){go(deck,cur-1);};
el('next').onclick=function(){if(cur<DECKS[deck].SL.length-1)go(deck,cur+1);};
el('jump').onchange=function(){go(deck,Number(el('jump').value));};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(deck,cur+1);else if(e.key==='ArrowLeft')go(deck,cur-1);});
var m=(location.hash||'').match(/^#([AB])(\d+)$/);
go(m?m[1]:'A',m?parseInt(m[2],10)-1:0);
paintMarks();
})();
</script>
