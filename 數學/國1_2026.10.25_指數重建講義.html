<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>指數重建講義</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='72' font-size='72' text-anchor='middle'%3E%F0%9F%94%A2%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#333;--sub:#555;--line:#e0d8ca;--ac:#c0704a;--ac2:#4a7a6b;--ac3:#4a6b9a;--bad:#b0442e;--soft:#f3ece0;--hi:#fff7e6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1f1d1a;--card:#2a2723;--ink:#eee;--sub:#bbb;--line:#4a443c;--ac:#e0916b;--ac2:#7fc4ad;--ac3:#8fb0e0;--bad:#ee8a74;--soft:#38342d;--hi:#3a3322}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","微軟正黑體","Noto Sans TC","PingFang TC",sans-serif;line-height:1.7;font-size:1.2rem}
.wrap{max-width:860px;margin:0 auto;padding:10px 16px 110px}
.tabs{display:flex;gap:8px;margin:2px 0 8px}
.tabs button{flex:1;font-family:inherit;font-size:1.05rem;padding:9px 8px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ac3);border-color:var(--ac3);color:#fff;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--sub)}
.top select{font-family:inherit;font-size:.9rem;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:62%}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ac2);width:0;transition:width .25s}
.slide{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.slide.cur{display:block}
.tag{display:inline-block;background:var(--ac3);color:#fff;border-radius:99px;padding:0 12px;font-size:.95rem}
.tag.sup{background:var(--ac2)}.tag.pr{background:var(--ac)}
h1{font-size:1.6rem;margin:6px 0 10px;line-height:1.35}
.fig{max-width:100%;height:auto;display:block;margin:8px auto;max-height:330px;color:var(--ink)}
.figs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:flex-end}
.figs .fig{max-width:48%}
.fig.big .lbl,.fig.big .lbl2,.fig.big .tI,.fig.big .tR,.fig.big .tF,.fig.big .tB{font-size:16px}
@media (orientation:portrait) and (min-width:600px){.fig{max-height:46vh}}
.txt{margin:8px 0}
.txt b{color:var(--ac)}
.txt ol,.txt ul{margin:6px 0;padding-left:1.4em}
.txt li{margin:4px 0}
.eq{font-size:1.5rem;font-weight:700;text-align:center;margin:8px 0;line-height:1.5}
table.t{border-collapse:collapse;width:100%;font-size:1.02rem;margin:8px 0}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.t th{background:var(--soft)}
.q{background:var(--hi);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:10px 0}
.q .p{font-weight:700}
details summary{cursor:pointer;color:var(--ac3);font-size:1rem}
.q .a{padding:4px 0;color:var(--ac2);font-weight:700}
.sheet{background:#fffbe3;border:2px dashed #d9b84a;border-radius:12px;padding:8px 12px;margin:10px 0;font-size:1rem;color:#3d3a2c}
.sheet b{color:#8a5a00}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .sheet{background:#3b3722;border-color:#a88c2f;color:#eee}:root:not([data-theme=light]) .sheet b{color:#f0c860}}
.src{font-size:.95rem;color:var(--sub);margin:-4px 0 10px}
.ai{display:inline-block;background:#e6f0eb;color:#2f5d4f;border:1px solid var(--ac2);border-radius:6px;padding:0 6px;font-size:.95rem;font-weight:700;line-height:1.5;white-space:nowrap}
.ai.re{background:#e8edf6;color:#344e78;border-color:var(--ac3)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .ai{background:#24352f;color:#9fd6c2}:root:not([data-theme=light]) .ai.re{background:#262f40;color:#a9c2ea}}
.note{margin-top:12px;font-size:.95rem;color:var(--sub)}
.note details{border-top:1px dashed var(--line);padding-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:12px;justify-content:center;z-index:5}
.nav button{font-family:inherit;font-size:1.2rem;padding:12px 28px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-width:130px}
.nav button.go{background:var(--ac);border-color:var(--ac);color:#fff}
.nav button:disabled{opacity:.4}
/* SVG 圖形 */
.lbl{fill:currentColor;font-size:14px}.lbl2{fill:currentColor;font-size:15px;font-weight:700}
.lbl,.lbl2,.tI,.tR,.tF{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.tI,.tR,.tF{font-size:14px;font-weight:700}
.tI{fill:var(--ac)}.tR{fill:var(--ac3)}.tF{fill:var(--ac2)}
.rI{stroke:var(--ac);stroke-width:3;fill:none}.rR{stroke:var(--ac3);stroke-width:3;fill:none}
.rF{stroke:var(--ac2);stroke-width:2.2;stroke-dasharray:6 4;fill:none}
.nl{stroke:var(--sub);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.ifc{stroke:currentColor;stroke-width:2.5}
.ghostL{stroke:var(--sub);stroke-width:2;stroke-dasharray:4 4;fill:none}
.q1,.q2,.q3,.q1d,.q2d,.q3d{stroke-width:2.4;fill:none}.q1,.q1d{stroke:var(--ac)}.q2,.q2d{stroke:var(--ac2)}.q3,.q3d{stroke:var(--ac3)}.q1d,.q2d,.q3d{stroke-dasharray:5 4;stroke-width:1.8}
.axis{stroke:currentColor;stroke-width:1.5}.obj{stroke:currentColor;stroke-width:3.5}.img{stroke:var(--bad);stroke-width:3.5}.imgd{stroke:var(--bad);stroke-width:3;stroke-dasharray:6 4}
.tB{fill:var(--bad);font-size:14px;font-weight:700;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.arcI{stroke:var(--ac);stroke-width:2;fill:none}.arcR{stroke:var(--ac3);stroke-width:2;fill:none}.arcF{stroke:var(--ac2);stroke-width:2;fill:none}.arcX{stroke:var(--sub);stroke-width:1.6;fill:none}
@media print{body{background:#fff;color:#000}.nav,.top select,.bar,.tabs{display:none}.slide{display:block!important;break-inside:avoid;page-break-after:always;border:0}.wrap{padding:0}details{display:block}details>summary{display:none}}
@media (max-width:560px){body{font-size:1.08rem}h1{font-size:1.4rem}.figs .fig{max-width:100%}.tabs button{font-size:.88rem;padding:8px 4px}.top{flex-direction:column;align-items:stretch;gap:4px}.top select{max-width:100%;width:100%}.nav{gap:8px;padding:8px 10px}.nav button{min-width:0;flex:1;padding:12px 6px;font-size:1.05rem;white-space:nowrap}}
/* 手寫層 */
.slide{position:relative}
.ink-cv{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
body.ink .wrap{touch-action:none;padding-bottom:190px}

.inkbar{position:fixed;left:0;right:0;bottom:68px;z-index:6;display:none;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding:8px 10px;background:var(--card);border-top:1px solid var(--line)}
body.ink .inkbar{display:flex}
.inkbar button{font-family:inherit;font-size:1rem;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}

.inkbar input{width:20px;height:20px}
@media print{.inkbar{display:none!important}}
/* 橫放（寬螢幕）：版面加寬，有圖的頁分左右兩欄，圖的高度跟著螢幕高度 */
@media (orientation:landscape) and (min-width:900px){
  .wrap{max-width:1280px;padding-top:6px}
  .tabs{margin:0 0 4px}
  .bar{margin:4px 0 8px}
  .slide{padding:12px 22px}

  .src{margin:0 0 6px}

  .sbody.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px;align-items:start}
  .sbody.tq{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
  .sbody.two .fig{max-height:calc(100vh - 280px);margin-top:4px}
  .sbody.two .figs .fig{max-height:calc(50vh - 110px)}
  .sbody:not(.two) .stxt{max-width:1000px;margin:0 auto}
  .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start}
}
/* 橫放、螢幕比較矮（高解析平板、網址列佔掉高度）：字稍微縮小 */

  body{font-size:1.08rem;line-height:1.6}
  .slide>h1{font-size:1.35rem}
  .tabs button{padding:6px 8px;font-size:.98rem}
  .q{padding:6px 12px;margin:7px 0}
  .eq{font-size:1.35rem;margin:4px 0}
  .sheet{padding:6px 10px;margin:7px 0}
  .sbody.two .fig{max-height:calc(100vh - 265px)}
  table.t{font-size:.95rem}table.t th,table.t td{padding:4px 6px}
  .nav{padding:6px 14px}.nav button{padding:9px 24px}

}

/* 手寫顏色圓點 */
.inkbar .dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* ❓ 標記有問題 */
.mk{font-family:inherit;font-size:.95rem;border:1.5px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;padding:1px 12px;cursor:pointer;vertical-align:middle;margin:0 0 4px 8px;line-height:1.6}
.mk.on{background:#fde7ee;border-color:#e91e63;color:#ad1457;font-weight:700}
.q .mq{float:right;margin:0 0 4px 8px;padding:0 10px}
.q.flash{outline:3px solid #e91e63;outline-offset:2px}
.qpanel{position:fixed;left:0;right:0;bottom:68px;z-index:7;display:none;max-height:55vh;overflow:auto;background:var(--card);border-top:2px solid #e91e63;padding:8px 16px 12px}
body.qp .qpanel{display:block}
.qph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.qph button{font-family:inherit;font-size:.95rem;margin-left:6px;padding:5px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.qpanel a{display:block;padding:8px 6px;border-bottom:1px dashed var(--line);color:var(--ink);text-decoration:none;cursor:pointer;font-size:1rem}
.qpanel a.sub{padding-left:26px;color:var(--sub)}
.qpanel .empty{color:var(--sub);padding:8px 6px;font-size:1rem}
.nav button.qon{background:#e91e63;border-color:#e91e63;color:#fff}
@media (orientation:landscape) and (min-width:900px) and (max-height:760px){.qpanel{bottom:58px}}
@media print{.qpanel,.mk{display:none!important}}
@media (max-width:560px){.nav button.sm{flex:0 0 auto;padding:12px 12px}.nav .lb{display:none}}

/* 觀念釐清選擇題 */
.mc{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.mo{font-family:inherit;font-size:1.05rem;text-align:left;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;line-height:1.5}
.mo b{color:var(--ac3);margin-right:4px}
.mo.ok{background:#e3f3ea;border-color:#2e8b57}
.mo.no{background:#fde9e4;border-color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .mo.ok{background:#1f3a2c}:root:not([data-theme=light]) .mo.no{background:#4a2a24}}
.mcf{font-size:1rem;margin:4px 0}
.mcf.good{color:#1f6b45}.mcf.bad{color:var(--bad)}.mcf .try{color:var(--sub)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .mcf.good{color:#8fe0b4}}
/* 數學：分數、指數 */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 2px}
.fr>span{padding:0 4px}.fr>span:first-child{border-bottom:1.5px solid currentColor}
.fp{font-size:1.6em;vertical-align:middle;line-height:1}
sup{line-height:0;font-size:.72em}
.c1{color:var(--ac);font-weight:700}.c2{color:var(--ac3);font-weight:700}.c3{color:var(--ac2);font-weight:700}
.bad{color:var(--bad);font-weight:700}
.big-eq{font-size:1.6rem;text-align:center;margin:8px 0;line-height:1.9}
.q .a .ex{font-weight:400;color:var(--ink)}

</style>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="top"><span>指數重建講義　1-4 指數記法與科學記號＋2-4 指數律</span><select id="jump" aria-label="跳到某一頁"></select></div>

<script>
(function(){
/* ===== 數學預習講義共用工具（分數／指數排版、選擇題 mc、表格）===== */
var UID=0;
function f1(x){return (Math.round(x*10)/10).toString();}
function T(x,y,t,cls,anchor){return '<text class="'+(cls||'lbl')+'" x="'+f1(x)+'" y="'+f1(y)+'" text-anchor="'+(anchor||'start')+'">'+t+'</text>';}
function P(b,e){return b+'<sup>'+e+'</sup>';}
function fr(n,d){return '<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>';}
function FP(n,d,e,neg){return '<span class="fp">(</span>'+(neg?'−':'')+fr(n,d)+'<span class="fp">)</span>'+(e!==undefined?'<sup>'+e+'</sup>':'');}
/* 選擇題：選項順序依題目文字固定洗牌（每次開啟順序相同），避免正解總在同一個位置。用 Math.imul 做乘法，h*1103515245 超過 2^53 會失去低位元，洗牌會偏向 */
function mc(q,o,a,w,exp){
  var h=7,i,idx=o.map(function(_,k){return k;});
  for(i=0;i<q.length;i++)h=(h*31+q.charCodeAt(i))>>>0;
  for(i=idx.length-1;i>0;i--){h=(Math.imul(h,1103515245)+12345)>>>0;var j=(h>>>8)%(i+1),t=idx[i];idx[i]=idx[j];idx[j]=t;}
  return [q,exp,{o:idx.map(function(k){return o[k];}),w:idx.map(function(k){return w[k];}),a:idx.indexOf(a)}];
}
function tbl(head,rows){
  var h='<table class="t"><tr>'+head.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr>';
  rows.forEach(function(r){h+='<tr>'+r.map(function(x){return '<td>'+x+'</td>';}).join('')+'</tr>';});
  return h+'</table>';
}
function eq(h){return '<div class="eq">'+h+'</div>';}

var AI='<span class="ai">💡 補充說明</span> ',RE='<span class="ai re">🔁 類題</span> ';
/* ===== 指數重建講義（1-4 指數記法與科學記號＋2-4 指數律）===== */
/* ===== 圖形 ===== */
/* 指數記法：2×2×2×2 ＝ 2⁴，標出底數和指數 */
function expFig(){
  var id='x'+(++UID),W=520,H=240;
  var s='<svg class="fig big" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="2 乘 2 乘 2 乘 2 等於 2 的 4 次方，2 是底數，4 是指數">';
  s+='<defs><marker id="'+id+'" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,1 L11,6 L0,11 Z" fill="currentColor"/></marker></defs>';
  s+='<text x="14" y="78" font-size="34" fill="currentColor">2×2×2×2</text>';
  s+='<path d="M16 96 Q16 108 28 108 L190 108 Q202 108 202 96" fill="none" stroke="var(--ac)" stroke-width="2.5"/>';
  s+=T(109,134,'有 4 個 2 連乘','lbl2','middle');
  s+='<text x="226" y="78" font-size="34" fill="currentColor">＝</text>';
  s+='<text x="285" y="104" font-size="90" font-weight="700" fill="var(--ac)">2</text>';
  s+='<text x="345" y="56" font-size="50" font-weight="700" fill="var(--ac3)">4</text>';
  s+=T(412,40,'指數','lbl2');s+=T(412,62,'連乘了幾個','lbl');
  s+='<line x1="408" y1="46" x2="380" y2="48" stroke="var(--ac3)" stroke-width="2" marker-end="url(#'+id+')"/>';
  s+=T(290,182,'底數','lbl2','middle');s+=T(290,204,'被連乘的那個數','lbl','middle');
  s+='<line x1="290" y1="168" x2="290" y2="118" stroke="var(--ac)" stroke-width="2" marker-end="url(#'+id+')"/>';
  return s+'</svg>';
}
/* 小數點跳格：ch 每個數字、g0 原來小數點所在的縫（0＝第一個數字前）、g1 新的縫 */
function jumpFig(ch,g0,g1,msg,res,zeroN){
  var id='j'+(++UID),bw=52,gap=4,x0=44,W=x0*2+ch.length*(bw+gap),H=250,y0=80,bh=58;
  var s='<svg class="fig big" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="小數點跳格示意圖">';
  s+='<defs><marker id="'+id+'" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,1 L11,6 L0,11 Z" fill="var(--ac)"/></marker></defs>';
  function gx(g){return x0+g*(bw+gap)-gap/2;}
  ch.forEach(function(c,i){
    var x=x0+i*(bw+gap),dim=(i<zeroN);
    s+='<rect x="'+x+'" y="'+y0+'" width="'+bw+'" height="'+bh+'" rx="8" fill="var(--soft)" stroke="var(--line)" stroke-width="2"/>';
    s+='<text x="'+(x+bw/2)+'" y="'+(y0+42)+'" font-size="36" text-anchor="middle" fill="'+(dim?'var(--sub)':'currentColor')+'" font-weight="'+(dim?'400':'700')+'">'+c+'</text>';
  });
  var a=gx(g0),b=gx(g1),mid=(a+b)/2;
  s+='<path d="M'+f1(a)+' '+(y0-8)+' Q'+f1(mid)+' 8 '+f1(b)+' '+(y0-8)+'" fill="none" stroke="var(--ac)" stroke-width="3" marker-end="url(#'+id+')"/>';
  s+=T(mid,24,msg,'lbl2','middle');
  s+='<circle cx="'+f1(a)+'" cy="'+(y0+bh+10)+'" r="7" fill="var(--bad)"/>'+T(a,y0+bh+40,'原來的小數點','lbl','middle');
  s+='<circle cx="'+f1(b)+'" cy="'+(y0+bh+10)+'" r="7" fill="var(--ac2)"/>'+T(b,y0+bh+62,'新的小數點','lbl','middle');
  s+=T(W/2,H-6,res,'lbl2','middle');
  return s+'</svg>';
}

A({t:'10 的負次方：1 在小數點後第幾位',tag:'重點',src:'課本 p.53 重點2 ①(2)、p.54 講解題⑤',
 text:'(0.1)ᵐ＝('+fr('1','10')+')ᵐ＝10⁻ᵐ。例：10⁻³＝('+fr('1','10')+')³＝0.001。<br>兩招，一看就知道怎麼寫：<ul><li><b>10ⁿ</b>（n 是正整數）：1 的後面接 <b>n 個 0</b>。例：10⁶＝1000000</li><li><b>10⁻ⁿ</b>：<b>1 在小數點後第 n 位</b>（小數點和 1 之間有 n−1 個 0）。例：10⁻⁴＝0.0001</li></ul>'+tbl(['10⁵','10²','10⁰','10⁻¹','10⁻⁴'],[['100000','100','1','0.1','0.0001'],['5 個 0','2 個 0','','第 1 位','第 4 位']]),

var deck='A',cur=0,QM={};

    else if(tq)h+='<div class="sfig"><div class="txt">'+s.text+'</div>'+(s.sheet?'<div class="sheet">✍️ <b>對照講義</b>：'+s.sheet+'</div>':'')+'</div>';
    h+='<div class="stxt">';

    if(s.sheet&&!tq)h+='<div class="sheet">✍️ <b>對照講義</b>：'+s.sheet+'</div>';
    if(s.qs){h+='<div class="qs'+(s.qs.length>2&&!s.fig&&!tq?' qgrid':'')+'">';s.qs.forEach(function(q,qi){h+='<div class="q" id="q'+k+i+'_'+qi+'"><button class="mk mq" data-k="'+k+i+':'+qi+'">❓</button><div class="p">'+(q[2]?'觀念釐清：':'想一想：')+q[0]+'</div>'+(q[2]?'<div class="mc">'+q[2].o.map(function(o,oi){return '<button class="mo" data-i="'+oi+'"><b>'+'ABCDE'.charAt(oi)+'.</b> '+o+'</button>';}).join('')+'</div><div class="mcf" aria-live="polite"></div><details><summary>直接看正解</summary><div class="a">✅ 答：'+'ABCDE'.charAt(q[2].a)+'. '+q[2].o[q[2].a]+'<br><span class="ex">'+q[1]+'</span></div></details>':'<details><summary>看答案</summary><div class="a">'+q[1]+'</div></details>')+'</div>';});h+='</div>';}
    if(s.note)h+='<div class="note"><details><summary>👂 上課聽這裡</summary>'+s.note+'</details></div>';
    h+='</div></div></section>';
  });
});
el('slides').innerHTML=h;
Object.keys(DECKS).forEach(function(k){DECKS[k].SL.forEach(function(s){if(s.init)s.init();});});
if(Object.keys(DECKS).length<2)el('tabs').style.display='none';
el('tabs').innerHTML=Object.keys(DECKS).map(function(k){return '<button data-d="'+k+'">'+DECKS[k].name+'</button>';}).join('');
function curId(){return 's'+deck+cur;}
function go(d,i){
  deck=d;var SL=DECKS[d].SL;cur=Math.max(0,Math.min(SL.length-1,i));
  Object.keys(DECKS).forEach(function(k){DECKS[k].SL.forEach(function(s,n){el('s'+k+n).classList.toggle('cur',k===d&&n===cur);});});
  Array.prototype.forEach.call(el('tabs').children,function(b){b.classList.toggle('on',b.getAttribute('data-d')===d);});
  el('jump').innerHTML=SL.map(function(s,n){return '<option value="'+n+'">'+(pageMarked(d,n)?'❓ ':'')+(n+1)+'. '+s.t.replace(/<[^>]+>/g,'')+'</option>';}).join('');
  el('jump').value=String(cur);
  el('pb').style.width=((cur+1)/SL.length*100)+'%';
  el('prev').disabled=cur===0;
  el('next').textContent=cur===SL.length-1?'完成 ✓':'下一步 ▶';
  try{history.replaceState(null,'','#'+d+(cur+1));}catch(e){}
  window.scrollTo(0,0);
  if(INK.cv[curId()])canvasFor(curId());
}

/* ===== 手寫層 =====
   每一頁各自一張透明畫布，筆跡存成向量（換頁再回來還在，重新整理才會消失）。
   「只有筆能寫」：觸控筆（或滑鼠）寫字，手指照常捲動、按「看答案」。 */
var INK={on:false,color:'pu',erase:false,penOnly:true,strokes:{},cv:{}};
try{var pp=localStorage.getItem('handout_ink_pen_only');if(pp!==null)INK.penOnly=(pp==='1');}catch(e){}
/* 手寫顏色刻意避開圖形用的橘、綠、藍、磚紅、深灰 */
var INKC={pu:['#7b1fa2','#ce93d8'],pk:['#e91e63','#f48fb1'],cy:['#0097a7','#4dd0e1']};
function inkColor(c){var dk=false;try{dk=matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.getAttribute('data-theme')!=='light';}catch(e){}return (INKC[c]||INKC.pu)[dk?1:0];}
function canvasFor(id){
  var sec=el(id),cv=INK.cv[id];
  if(!cv){cv=document.createElement('canvas');cv.className='ink-cv';sec.appendChild(cv);INK.cv[id]=cv;}
  if(!INK.strokes[id])INK.strokes[id]=[];
  var w=sec.clientWidth,hh=sec.clientHeight,r=window.devicePixelRatio||1;
  if(w&&hh&&(cv._w!==w||cv._h!==hh||cv._r!==r)){cv._w=w;cv._h=hh;cv._r=r;cv.width=Math.round(w*r);cv.height=Math.round(hh*r);cv.style.width=w+'px';cv.style.height=hh+'px';redraw(id);}
  return cv;
}
function seg(ctx,s,a,b){ctx.strokeStyle=inkColor(s.c);ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
function redraw(id){
  var cv=INK.cv[id];if(!cv||!cv._w)return;var ctx=cv.getContext('2d'),r=cv._r||1;
  ctx.setTransform(r,0,0,r,0,0);ctx.clearRect(0,0,cv._w,cv._h);
  (INK.strokes[id]||[]).forEach(function(s){
    if(s.p.length===1){seg(ctx,s,s.p[0],[s.p[0][0]+0.1,s.p[0][1]]);return;}
    ctx.strokeStyle=inkColor(s.c);ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(s.p[0][0],s.p[0][1]);
    for(var k=1;k<s.p.length;k++)ctx.lineTo(s.p[k][0],s.p[k][1]);ctx.stroke();
  });
}
function eraseAt(x,y){
  function near(p,q){var vx=q[0]-p[0],vy=q[1]-p[1],L=vx*vx+vy*vy,t=L?Math.max(0,Math.min(1,((x-p[0])*vx+(y-p[1])*vy)/L)):0,dx=p[0]+t*vx-x,dy=p[1]+t*vy-y;return dx*dx+dy*dy<196;}
  var id=curId(),a=INK.strokes[id]||[],keep=a.filter(function(s){for(var k=0;k<s.p.length;k++)if(near(s.p[k],s.p[Math.min(k+1,s.p.length-1)]))return false;return true;});
  if(keep.length!==a.length){INK.strokes[id]=keep;redraw(id);}
}
var drawing=null,finger=null;
function pos(e){var rc=INK.cv[curId()].getBoundingClientRect();return [Math.round((e.clientX-rc.left)*10)/10,Math.round((e.clientY-rc.top)*10)/10];}
el('slides').addEventListener('pointerdown',function(e){
  if(!INK.on)return;
  var penLike=(e.pointerType==='pen'||e.pointerType==='mouse');
  if(!penLike&&INK.penOnly){finger={id:e.pointerId,y:e.clientY};return;}
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();var id=curId();canvasFor(id);
  var p=pos(e),er=INK.erase||(e.buttons&32)===32;
  drawing={id:e.pointerId,erase:er,sec:id};
  try{el('slides').setPointerCapture(e.pointerId);}catch(_){}
  if(er){eraseAt(p[0],p[1]);return;}
  drawing.s={c:INK.color,w:e.pointerType==='pen'?3:4,p:[p]};INK.strokes[id].push(drawing.s);redraw(id);
});
el('slides').addEventListener('pointermove',function(e){
  if(finger&&e.pointerId===finger.id){window.scrollBy(0,finger.y-e.clientY);finger.y=e.clientY;return;}
  if(!drawing||e.pointerId!==drawing.id)return;
  e.preventDefault();
  var evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e],ctx=INK.cv[drawing.sec].getContext('2d');
  evs.forEach(function(ev){
    var p=pos(ev);
    if(drawing.erase){eraseAt(p[0],p[1]);return;}
    var pts=drawing.s.p,last=pts[pts.length-1];
    if(Math.abs(p[0]-last[0])+Math.abs(p[1]-last[1])<1)return;
    pts.push(p);seg(ctx,drawing.s,last,p);
  });
});
function endInk(e){if(finger&&e.pointerId===finger.id)finger=null;if(drawing&&e.pointerId===drawing.id)drawing=null;}
el('slides').addEventListener('pointerup',endInk);
el('slides').addEventListener('pointercancel',endInk);
function setInk(on){
  INK.on=on;document.body.classList.toggle('ink',on);
  el('inkBtn').classList.toggle('inkon',on);el('inkBtn').setAttribute('aria-pressed',on?'true':'false');
  el('inkBtn').innerHTML=on?'✏️<span class="lb"> 手寫中</span>':'✏️<span class="lb"> 手寫</span>';
  if(on)canvasFor(curId());
}
function markTool(){
  el('inkbar').querySelectorAll('button[data-c]').forEach(function(b){b.classList.toggle('on',!INK.erase&&b.dataset.c===INK.color);});
  el('inkErase').classList.toggle('on',INK.erase);
}
el('inkBtn').onclick=function(){setInk(!INK.on);if(INK.on)setQP(false);};
el('inkbar').querySelectorAll('button[data-c]').forEach(function(b){b.onclick=function(){INK.color=b.dataset.c;INK.erase=false;markTool();};});
el('inkErase').onclick=function(){INK.erase=!INK.erase;markTool();};
el('inkUndo').onclick=function(){var id=curId(),a=INK.strokes[id];if(a&&a.length){a.pop();redraw(id);}};
el('inkClear').onclick=function(){var id=curId(),a=INK.strokes[id];if(a&&a.length&&confirm('清除這一頁的手寫？')){INK.strokes[id]=[];redraw(id);}};
el('inkSpace').onclick=function(){var sec=el(curId()),pb=parseInt(sec.style.paddingBottom||'18',10);sec.style.paddingBottom=(pb+320)+'px';canvasFor(curId());window.scrollBy(0,320);};

el('inkPen').onchange=function(){INK.penOnly=el('inkPen').checked;try{localStorage.setItem('handout_ink_pen_only',INK.penOnly?'1':'0');}catch(e){}};
window.addEventListener('resize',function(){if(INK.cv[curId()])canvasFor(curId());});
el('slides').addEventListener('toggle',function(){if(INK.cv[curId()])canvasFor(curId());},true);

/* ===== ❓ 標記有問題的頁、題 =====
   點頁面上的「❓ 這頁有問題」或想一想右上角的「❓」標記；下方「❓ 問題」列出全部，點了直接跳過去。
   存在這台裝置的瀏覽器（localStorage），重新整理還在。 */
var QKEY='handout_marks_'+document.title;
try{QM=JSON.parse(localStorage.getItem(QKEY)||'{}')||{};}catch(e){QM={};}
function saveQM(){try{localStorage.setItem(QKEY,JSON.stringify(QM));}catch(e){}}
function plain(x){return String(x).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();}
function cut(x,n){return x.length>n?x.slice(0,n)+'…':x;}
function mkParse(k){return k.match(/^([A-Z])(\d+)(?::(\d+))?$/);}
function paintMarks(){
  el('slides').querySelectorAll('.mk').forEach(function(b){var on=!!QM[b.dataset.k];b.classList.toggle('on',on);if(!b.classList.contains('mq'))b.textContent=on?'❗ 已標記有問題':'❓ 這頁有問題';b.setAttribute('aria-pressed',on?'true':'false');});
  var n=Object.keys(QM).length;el('qpBtn').innerHTML='❓<span class="lb"> 問題</span>'+(n?'（'+n+'）':'');
  var SL=DECKS[deck].SL;Array.prototype.forEach.call(el('jump').options,function(o,i){o.textContent=(pageMarked(deck,i)?'❓ ':'')+(i+1)+'. '+plain(SL[i].t);});
  var multi=Object.keys(DECKS).length>1,keys=Object.keys(QM).filter(mkParse).sort(function(a,b){var pa=mkParse(a),pb=mkParse(b);if(pa[1]!==pb[1])return pa[1]<pb[1]?-1:1;return (+pa[2]-pb[2])||((pa[3]===undefined?-1:+pa[3])-(pb[3]===undefined?-1:+pb[3]));});
  var out='',lastPage='';
  keys.forEach(function(k){
    var m=mkParse(k);if(!DECKS[m[1]])return;var s=DECKS[m[1]].SL[+m[2]];if(!s)return;
    var head=(multi?DECKS[m[1]].name.split('｜')[0]+'　':'')+'第 '+(+m[2]+1)+' 頁　'+cut(plain(s.t),22);
    if(m[3]===undefined){out+='<a data-go="'+k+'">📄 '+head+'</a>';lastPage=m[1]+m[2];}
    else{var q=s.qs&&s.qs[+m[3]];if(!q)return;if(lastPage!==m[1]+m[2])out+='<a data-go="'+m[1]+m[2]+'">📄 '+head+'</a>';lastPage=m[1]+m[2];out+='<a class="sub" data-go="'+k+'">└ 想一想：'+cut(plain(q[0]),30)+'</a>';}
  });
  el('qpList').innerHTML=out||'<div class="empty">還沒有標記。看不懂的頁按標題旁的「❓ 這頁有問題」，看不懂的題目按想一想右上角的「❓」。</div>';
}
function setQP(on){document.body.classList.toggle('qp',on);el('qpBtn').classList.toggle('qon',on);if(on&&INK.on)setInk(false);}
el('slides').addEventListener('click',function(e){var b=e.target.closest('.mk');if(!b)return;e.preventDefault();var k=b.dataset.k;if(QM[k])delete QM[k];else QM[k]=1;saveQM();paintMarks();});
/* 選擇題：點選項 → 立刻顯示對錯；答錯的題自動標 ❓ */
el('slides').addEventListener('click',function(e){

  var box=b.closest('.q'),m=box.id.match(/^q([A-Z])(\d+)_(\d+)$/);if(!m)return;
  var q=DECKS[m[1]].SL[+m[2]].qs[+m[3]],i=+b.dataset.i,mc=q[2],ok=(i===mc.a),f=box.querySelector('.mcf');
  Array.prototype.forEach.call(box.querySelectorAll('.mo'),function(x){x.classList.remove('ok','no');});

el('qpList').onclick=function(e){var a=e.target.closest('a[data-go]');if(!a)return;var m=mkParse(a.dataset.go);go(m[1],+m[2]);setQP(false);
  if(m[3]!==undefined){var q=el('q'+m[1]+m[2]+'_'+m[3]);if(q){q.scrollIntoView({block:'center'});q.classList.add('flash');setTimeout(function(){q.classList.remove('flash');},1600);}}};

el('tabs').onclick=function(e){var b=e.target.closest('button');if(b)go(b.getAttribute('data-d'),0);};
el('prev').onclick=function(){go(deck,cur-1);};
el('next').onclick=function(){if(cur<DECKS[deck].SL.length-1)go(deck,cur+1);};
el('jump').onchange=function(){go(deck,Number(el('jump').value));};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(deck,cur+1);else if(e.key==='ArrowLeft')go(deck,cur-1);});
var m=(location.hash||'').match(/^#([AB])(\d+)$/);
go(m?m[1]:'A',m?parseInt(m[2],10)-1:0);
paintMarks();
})();
</script>
</body>
